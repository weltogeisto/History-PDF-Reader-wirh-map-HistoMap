<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScrollThroughTime - Historical Map Reader</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.3/leaflet.css"
  />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.3/leaflet.js"></script>

  <!-- jsPDF (for test PDF) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    /* Reset / base */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      overscroll-behavior: none;
    }

    /* Reading progress bar */
    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      z-index: 100;
      width: 0;
      transition: width 0.2s;
    }

    /* Layout */
    #pdf-viewer {
      overflow-y: auto;
      background: #f9fafb;
    }
    #map-container {
      background: #e5e7eb;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* PDF pages */
    .pdf-container {
      max-width: 100%;
      padding: 20px;
    }
    .pdf-page-wrapper {
      position: relative;
      margin-bottom: 40px;
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .pdf-canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    .page-number {
      text-align: center;
      color: #9ca3af;
      font-size: 0.875rem;
      padding: 10px;
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
    }

    /* Text overlay / location badges */
    .text-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    .location-badge {
      position: absolute;
      background: rgba(59, 130, 246, 0.15);
      border: 1.5px solid rgba(59, 130, 246, 0.6);
      border-radius: 4px;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(59, 130, 246, 0.25);
    }
    .location-badge::after {
      content: attr(data-location);
      position: absolute;
      top: -18px;
      left: 0;
      background: rgba(59, 130, 246, 0.9);
      color: white;
      padding: 2px 6px;
      font-size: 10px;
      border-radius: 4px;
      white-space: nowrap;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }
    .location-badge:hover {
      background: rgba(59, 130, 246, 0.25);
      transform: scale(1.03);
      box-shadow: 0 3px 8px rgba(59, 130, 246, 0.35);
      z-index: 10;
    }
    .location-badge.active {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.75);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.45);
      z-index: 15;
    }

    /* Resize handle */
    .resize-handle {
      display: none;
      background: linear-gradient(
        to right,
        #e5e7eb 0%,
        #9ca3af 50%,
        #e5e7eb 100%
      );
      cursor: ew-resize;
      z-index: 20;
      touch-action: none;
    }
    .resize-handle::before {
      content: "⋮⋮";
      color: white;
      font-size: 0.75rem;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Desktop: side-by-side, vertical resize handle */
    @media (min-width: 769px) {
      #pdf-viewer,
      #map-container {
        height: calc(100vh - 4rem);
      }
      .resize-handle {
        display: block;
        width: 10px;
        height: 100%;
        position: relative;
      }
    }

    /* Mobile: stacked, horizontal resize handle */
    @media (max-width: 768px) {
      nav {
        position: relative !important;
      }
      .nav-controls {
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .nav-controls button {
        font-size: 0.75rem !important;
        padding: 0.5rem !important;
      }
      .main-content {
        flex-direction: column !important;
        padding-top: 0 !important;
      }
      #pdf-viewer,
      #map-container {
        width: 100% !important;
        height: 50vh !important;
        position: relative !important;
      }
      .resize-handle {
        display: block;
        width: 100%;
        height: 10px;
        background: linear-gradient(
          to bottom,
          #e5e7eb 0%,
          #9ca3af 50%,
          #e5e7eb 100%
        );
        cursor: ns-resize;
        position: relative;
      }
      .resize-handle::before {
        content: "⋯⋯";
      }
    }

    /* Timeline controls */
    .timeline-controls {
      width: 90%;
      padding: 0.5rem;
    }
  </style>
</head>
<body class="bg-gray-100">
  <!-- Reading Progress -->
  <div class="reading-progress" id="readingProgress"></div>

  <!-- Nav -->
  <nav class="bg-white shadow-md fixed w-full z-10">
    <div class="max-w-7xl mx-auto px-2 sm:px-4 lg:px-6">
      <div class="flex justify-between h-auto md:h-16 py-2 md:py-0">
        <div class="flex items-center">
          <i data-feather="map" class="text-red-600 mr-2 w-5 h-5"></i>
          <span class="text-lg md:text-xl font-bold text-gray-800">
            ScrollThroughTime
          </span>
        </div>
        <div class="flex items-center flex-wrap gap-2 nav-controls">
          <button
            id="upload-btn"
            class="px-3 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition flex items-center text-sm"
          >
            <i data-feather="upload" class="mr-1 w-4 h-4"></i>
            Upload
          </button>
          <button
            id="generate-test-pdf"
            class="px-3 py-2 bg-green-500 text-white rounded-md hover:bg-green-600 transition flex items-center text-sm"
          >
            <i data-feather="file-text" class="mr-1 w-4 h-4"></i>
            Test
          </button>
          <button
            id="auto-map-toggle"
            class="px-3 py-2 bg-teal-500 text-white rounded-md hover:bg-teal-600 transition text-sm"
          >
            Auto ON
          </button>
          <input
            type="file"
            id="pdf-input"
            accept=".pdf"
            class="hidden"
          />
        </div>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <div class="pt-0 md:pt-16 pb-8 flex flex-col md:flex-row main-content">
    <!-- PDF viewer -->
    <div
      id="pdf-viewer"
      class="w-full md:w-1/2 h-screen overflow-y-auto bg-gray-50"
    >
      <div
        id="pdf-placeholder"
        class="text-center py-20 text-gray-500"
      >
        <i data-feather="file" class="w-12 h-12 mx-auto mb-4"></i>
        <h3 class="text-xl font-medium">No PDF Loaded</h3>
        <p class="mt-2">Upload a PDF or click Test to begin</p>
      </div>
      <div id="pdf-container" class="pdf-container hidden"></div>
    </div>

    <!-- Resize handle -->
    <div id="resizeHandle" class="resize-handle"></div>

    <!-- Map -->
    <div
      id="map-container"
      class="w-full md:w-1/2 h-screen sticky top-16"
    >
      <div id="map"></div>
    </div>
  </div>

  <!-- Timeline controls -->
  <div
    class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-white p-3 rounded-lg shadow-xl flex items-center space-x-4 z-10 timeline-controls"
  >
    <button
      id="prev-marker"
      class="p-2 rounded-full bg-gray-200 hover:bg-gray-300 transition"
    >
      <i data-feather="chevron-left" class="w-4 h-4"></i>
    </button>

    <div
      id="timeline-bar"
      class="w-32 md:w-64 h-2 bg-gray-200 rounded-full relative cursor-pointer"
    >
      <div
        id="timeline-progress"
        class="absolute top-0 left-0 h-full bg-blue-600 rounded-full transition-all duration-300"
        style="width: 0"
      ></div>
    </div>

    <button
      id="next-marker"
      class="p-2 rounded-full bg-gray-200 hover:bg-gray-300 transition"
    >
      <i data-feather="chevron-right" class="w-4 h-4"></i>
    </button>

    <span class="text-sm font-medium">
      <span id="marker-counter">0/0</span>
    </span>
  </div>

  <script>
    // Ensure PDF.js worker is configured
    if (typeof window.pdfjsLib !== "undefined") {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    }

    const state = {
      pdfDoc: null,
      map: null,
      regionPolygons: [],
      autoMap: true,
      allLocations: [],
      currentLocationIndex: 0,
      isResizing: false,
      activeMapMarker: null,
      activeRegionPolygon: null,
    };

    // Geo database
    const geoDatabase = {
      Constantinople: [41.0082, 28.9784],
      Istanbul: [41.0082, 28.9784],
      Moscow: [55.7558, 37.6173],
      Crimea: [45.0, 34.0],
      "Black Sea": [43.0, 35.0],
      Azov: [47.1, 39.4],
      Sevastopol: [44.6167, 33.525],
      Kiev: [50.4501, 30.5234],
      Vienna: [48.2082, 16.3738],
      Danube: [45.0, 29.0],
      Volga: [55.0, 49.0],
      Athens: [37.9838, 23.7275],
      Varna: [43.2141, 27.9147],
      Sofia: [42.6977, 23.3219],
      Belgrade: [44.7866, 20.4489],
      Bucharest: [44.4268, 26.1025],
      Odessa: [46.4825, 30.7233],
      Erzurum: [39.9, 41.2667],
      Cairo: [30.0444, 31.2357],
      Baghdad: [33.3152, 44.3661],
      Damascus: [33.5138, 36.2765],
      Mohacs: [45.9928, 18.6839],
      Hungary: [47.1625, 19.5033],
      German: [51.1657, 10.4515],
      Germany: [51.1657, 10.4515],
      Habsburg: [48.2082, 16.3738],
      Austria: [47.5162, 14.5501],
    };

    const regionPolygons = {
      Anatolia: {
        coords: [
          [36.0, 26.0],
          [41.5, 26.0],
          [42.0, 40.0],
          [37.0, 44.5],
          [36.0, 26.0],
        ],
        color: "#3b82f6",
      },
      Balkans: {
        coords: [
          [37.0, 19.0],
          [46.0, 13.0],
          [47.0, 22.0],
          [40.0, 28.0],
          [37.0, 21.0],
        ],
        color: "#8b5cf6",
      },
      Caucasus: {
        coords: [
          [40.0, 38.0],
          [44.0, 48.0],
          [40.0, 48.0],
          [40.0, 38.0],
        ],
        color: "#10b981",
      },
    };

    function initMap() {
      state.map = L.map("map").setView([45, 25], 5);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: "© OpenStreetMap",
      }).addTo(state.map);

      // Add region polygons
      Object.keys(regionPolygons).forEach((name) => {
        const region = regionPolygons[name];
        const polygon = L.polygon(region.coords, {
          color: region.color,
          fillColor: region.color,
          fillOpacity: 0,
          weight: 2,
          opacity: 0,
        }).addTo(state.map);
        polygon.bindPopup("<b>" + name + "</b>");
        polygon.regionName = name;
        state.regionPolygons.push(polygon);
      });
    }

    function handleLocationClick(locationName, element) {
      const coords = geoDatabase[locationName];
      if (!coords) return;

      // Update active badge
      document
        .querySelectorAll(".location-badge")
        .forEach((el) => el.classList.remove("active"));
      element.classList.add("active");

      // Update current index for timeline
      const idx = state.allLocations.findIndex(
        (loc) => loc.name === locationName && loc.element === element
      );
      if (idx !== -1) {
        state.currentLocationIndex = idx;
        updateTimeline();
      }

      if (!state.autoMap || !state.map) return;

      // Clear existing map highlights
      if (state.activeMapMarker) {
        state.map.removeLayer(state.activeMapMarker);
        state.activeMapMarker = null;
      }
      if (state.activeRegionPolygon) {
        state.activeRegionPolygon.setStyle({
          fillOpacity: 0,
          opacity: 0,
          weight: 2,
        });
        state.activeRegionPolygon = null;
      }

      // Handle region polygons vs points
      const regionDef = regionPolygons[locationName];
      if (regionDef) {
        const poly = state.regionPolygons.find(
          (p) => p.regionName === locationName
        );
        if (poly) {
          state.regionPolygons.forEach((p) =>
            p.setStyle({ fillOpacity: 0, opacity: 0, weight: 2 })
          );
          poly.setStyle({
            fillOpacity: 0.35,
            opacity: 0.9,
            weight: 3,
          });
          state.activeRegionPolygon = poly;
          state.map.fitBounds(poly.getBounds());
        }
      } else {
        state.map.setView(coords, 8);
        const marker = L.circleMarker(coords, {
          radius: 15,
          fillColor: "#ef4444",
          color: "#ffffff",
          weight: 3,
          fillOpacity: 0.7,
        })
          .addTo(state.map)
          .bindPopup("<b>" + locationName + "</b>")
          .openPopup();

        state.activeMapMarker = marker;
      }
    }

    async function renderAllPages() {
      const container = document.getElementById("pdf-container");
      container.innerHTML = "";
      state.allLocations = [];

      console.log("Rendering PDF pages…");
      for (let pageNum = 1; pageNum <= state.pdfDoc.numPages; pageNum++) {
        const page = await state.pdfDoc.getPage(pageNum);
        const scale = 1.5;
        const viewport = page.getViewport({ scale });

        // Page wrapper
        const pageWrapper = document.createElement("div");
        pageWrapper.className = "pdf-page-wrapper";
        pageWrapper.dataset.page = pageNum;

        // Page number
        const pageNumber = document.createElement("div");
        pageNumber.className = "page-number";
        pageNumber.textContent = "Page " + pageNum;
        pageWrapper.appendChild(pageNumber);

        // Canvas container
        const canvasContainer = document.createElement("div");
        canvasContainer.style.position = "relative";
        canvasContainer.style.width = viewport.width + "px";
        canvasContainer.style.height = viewport.height + "px";

        // Canvas
        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.className = "pdf-canvas";

        await page.render({ canvasContext: ctx, viewport }).promise;
        canvasContainer.appendChild(canvas);

        // Text overlay
        const textOverlay = document.createElement("div");
        textOverlay.className = "text-overlay";

        const textContent = await page.getTextContent();

        textContent.items.forEach((item) => {
          const rawText = (item.str || "").trim();
          if (!rawText) return;

          const transform = item.transform || [];
          const x = transform[4] || 0;
          const y = viewport.height - (transform[5] || 0);
          const fontHeight = Math.sqrt(
            (transform[2] || 0) * (transform[2] || 0) +
              (transform[3] || 0) * (transform[3] || 0)
          );
          const baseWidth = (item.width || 0) * viewport.scale;
          const avgCharWidth =
            rawText.length > 0 ? baseWidth / rawText.length : 0;

          Object.keys(geoDatabase).forEach((location) => {
            const regex = new RegExp(`\\b${location}\\b`, "gi");
            const matches = rawText.matchAll(regex);

            Array.from(matches).forEach((match) => {
              const startIndex = match.index || 0;
              const wordLength = match[0].length;
              const highlightWidth = Math.max(
                avgCharWidth * wordLength,
                location.length * 6
              );
              const leftOffset = x + startIndex * avgCharWidth;
              const highlightHeight = fontHeight || 14;

              const highlight = document.createElement("div");
              highlight.className = "location-badge";
              highlight.dataset.location = location;
              highlight.style.left = leftOffset + "px";
              highlight.style.top = y - highlightHeight + "px";
              highlight.style.width = highlightWidth + "px";
              highlight.style.height = highlightHeight + "px";
              highlight.title = "Click to view location on map";

              highlight.onclick = () => handleLocationClick(location, highlight);

              textOverlay.appendChild(highlight);

              // Track for timeline
              state.allLocations.push({
                name: location,
                element: highlight,
                page: pageNum,
              });
            });
          });
        });

        canvasContainer.appendChild(textOverlay);
        pageWrapper.appendChild(canvasContainer);
        container.appendChild(pageWrapper);
      }

      console.log("Total locations found:", state.allLocations.length);
      updateTimeline();
    }

    function updateTimeline() {
      const total = state.allLocations.length;
      const counter = document.getElementById("marker-counter");
      counter.textContent =
        (total === 0 ? 0 : state.currentLocationIndex + 1) + "/" + total;

      if (total === 0) {
        document.getElementById("timeline-progress").style.width = "0";
        return;
      }

      const progress =
        (state.currentLocationIndex /
          Math.max(total - 1, 1)) *
        100;
      document.getElementById("timeline-progress").style.width =
        progress + "%";
    }

    function navigateToLocation(index) {
      if (index < 0 || index >= state.allLocations.length) return;
      state.currentLocationIndex = index;
      const location = state.allLocations[index];

      location.element.scrollIntoView({
        behavior: "smooth",
        block: "center",
      });

      handleLocationClick(location.name, location.element);
    }

    function updateReadingProgress() {
      const viewer = document.getElementById("pdf-viewer");
      if (!viewer) return;
      const scrollPercent =
        (viewer.scrollTop /
          (viewer.scrollHeight - viewer.clientHeight || 1)) *
        100;
      document.getElementById("readingProgress").style.width =
        Math.min(scrollPercent, 100) + "%";
    }

    async function loadPDF(fileOrBlob) {
      try {
        if (typeof window.pdfjsLib === "undefined") {
          throw new Error("PDF.js library not loaded");
        }

        let arrayBuffer;
        if (fileOrBlob instanceof Blob) {
          arrayBuffer = await fileOrBlob.arrayBuffer();
        } else {
          // File from input
          arrayBuffer = await fileOrBlob.arrayBuffer();
        }

        const loadingTask = window.pdfjsLib.getDocument({
          data: new Uint8Array(arrayBuffer),
        });
        state.pdfDoc = await loadingTask.promise;

        document
          .getElementById("pdf-placeholder")
          .classList.add("hidden");
        document
          .getElementById("pdf-container")
          .classList.remove("hidden");

        await renderAllPages();
      } catch (error) {
        alert("Error loading PDF: " + error.message);
        console.error("PDF Error", error);
      }
    }

    function generateTestPDF() {
      if (!window.jspdf) {
        alert("jsPDF library not loaded");
        return;
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      // Page 1
      doc.setFontSize(16);
      doc.text("The Battle of Mohacs 1526", 20, 20);
      doc.setFontSize(12);
      doc.text(
        "Near Hungary, Ottoman forces defeated Habsburg.",
        20,
        40
      );
      doc.text(
        "The march continued toward Vienna and the Danube.",
        20,
        50
      );
      doc.text(
        "German resistance formed as Constantinople directed.",
        20,
        60
      );

      // Page 2
      doc.addPage();
      doc.setFontSize(16);
      doc.text("Ottoman Expansion", 20, 20);
      doc.setFontSize(12);
      doc.text(
        "Key cities: Constantinople, Moscow, Cairo, Baghdad.",
        20,
        40
      );
      doc.text("Regions: Anatolia, Balkans, and Caucasus.", 20, 50);
      doc.text(
        "Strategic areas: Black Sea and Crimea.",
        20,
        60
      );

      // Page 3
      doc.addPage();
      doc.setFontSize(16);
      doc.text("Later Campaigns", 20, 20);
      doc.setFontSize(12);
      doc.text(
        "Extended to Damascus and Baghdad in the east.",
        20,
        40
      );
      doc.text(
        "Cities: Belgrade, Bucharest, Odessa, Sevastopol.",
        20,
        50
      );
      doc.text(
        "Struggle for Austria and Vienna continued.",
        20,
        60
      );

      const blob = doc.output("blob");
      loadPDF(blob);
    }

    function initResizer() {
      const handle = document.getElementById("resizeHandle");
      const pdfViewer = document.getElementById("pdf-viewer");
      const mapContainer = document.getElementById("map-container");

      let startY = 0;
      let startX = 0;
      let startHeightPdf = 0;
      let startWidthPdf = 0;

      function startResize(e) {
        state.isResizing = true;
        const isTouch = e.type === "touchstart";
        startY = isTouch ? e.touches[0].clientY : e.clientY;
        startX = isTouch ? e.touches[0].clientX : e.clientX;
        startHeightPdf = pdfViewer.offsetHeight;
        startWidthPdf = pdfViewer.offsetWidth;

        document.addEventListener("mousemove", resize);
        document.addEventListener("touchmove", resize);
        document.addEventListener("mouseup", stopResize);
        document.addEventListener("touchend", stopResize);
        e.preventDefault();
      }

      function resize(e) {
        if (!state.isResizing) return;
        const isTouch = e.type === "touchmove";

        if (window.innerWidth <= 768) {
          // Vertical resize (stacked)
          const currentY = isTouch ? e.touches[0].clientY : e.clientY;
          const newHeight = startHeightPdf + (currentY - startY);
          const minHeight = window.innerHeight * 0.2;
          const maxHeight = window.innerHeight * 0.8;

          const clamped = Math.max(minHeight, Math.min(maxHeight, newHeight));
          pdfViewer.style.height = clamped + "px";
          mapContainer.style.height =
            window.innerHeight - clamped - 10 + "px";
        } else {
          // Horizontal resize (side-by-side)
          const currentX = isTouch ? e.touches[0].clientX : e.clientX;
          const newWidth = startWidthPdf + (currentX - startX);
          const minWidth = window.innerWidth * 0.2;
          const maxWidth = window.innerWidth * 0.8;

          const clamped = Math.max(minWidth, Math.min(maxWidth, newWidth));
          pdfViewer.style.width = clamped + "px";
          mapContainer.style.width =
            window.innerWidth - clamped - 10 + "px";

          if (state.map) {
            state.map.invalidateSize();
          }
        }
      }

      function stopResize() {
        state.isResizing = false;
        document.removeEventListener("mousemove", resize);
        document.removeEventListener("touchmove", resize);
        document.removeEventListener("mouseup", stopResize);
        document.removeEventListener("touchend", stopResize);
      }

      handle.addEventListener("mousedown", startResize);
      handle.addEventListener("touchstart", startResize, {
        passive: false,
      });
    }

    // Event listeners
    document
      .getElementById("upload-btn")
      .addEventListener("click", () =>
        document.getElementById("pdf-input").click()
      );

    document
      .getElementById("pdf-input")
      .addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (file) loadPDF(file);
      });

    document
      .getElementById("generate-test-pdf")
      .addEventListener("click", generateTestPDF);

    document
      .getElementById("auto-map-toggle")
      .addEventListener("click", (e) => {
        state.autoMap = !state.autoMap;
        e.target.textContent = "Auto " + (state.autoMap ? "ON" : "OFF");
        e.target.classList.toggle("bg-teal-500", state.autoMap);
        e.target.classList.toggle("bg-gray-400", !state.autoMap);
      });

    document
      .getElementById("prev-marker")
      .addEventListener("click", () => {
        if (state.currentLocationIndex > 0) {
          navigateToLocation(state.currentLocationIndex - 1);
        }
      });

    document
      .getElementById("next-marker")
      .addEventListener("click", () => {
        if (
          state.currentLocationIndex <
          state.allLocations.length - 1
        ) {
          navigateToLocation(state.currentLocationIndex + 1);
        }
      });

    document
      .getElementById("timeline-bar")
      .addEventListener("click", (e) => {
        if (!state.allLocations.length) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        const targetIndex = Math.floor(percent * state.allLocations.length);
        navigateToLocation(
          Math.min(targetIndex, state.allLocations.length - 1)
        );
      });

    document
      .getElementById("pdf-viewer")
      .addEventListener("scroll", updateReadingProgress);

    // Init
    initMap();
    initResizer();
    feather.replace();
    console.log("ScrollThroughTime initialized");
  </script>
</body>
</html>
