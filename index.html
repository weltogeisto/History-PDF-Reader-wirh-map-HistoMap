<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScrollThroughTime - Historical Map Reader</title>
  <meta
    http-equiv="Content-Security-Policy"
    content="default-src 'self'; img-src 'self' data: https://*.tile.openstreetmap.org https://server.arcgisonline.com https://*.basemaps.cartocdn.com; script-src 'self' 'unsafe-inline' https://cdn.tailwindcss.com https://unpkg.com https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; font-src 'self' data:; connect-src 'self' https://*.tile.openstreetmap.org https://server.arcgisonline.com https://*.basemaps.cartocdn.com; worker-src 'self' blob: https://cdnjs.cloudflare.com;"
  />

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com" referrerpolicy="no-referrer"></script>

  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons" referrerpolicy="no-referrer"></script>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.3/leaflet.css"
    referrerpolicy="no-referrer"
  />
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.3/leaflet.js"
    referrerpolicy="no-referrer"
  ></script>

  <!-- Leaflet.Draw -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.css"
    referrerpolicy="no-referrer"
  />
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/leaflet.draw/1.0.4/leaflet.draw.js"
    referrerpolicy="no-referrer"
  ></script>

  <!-- jsPDF (for test PDF) -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"
    referrerpolicy="no-referrer"
  ></script>

  <!-- PDF.js -->
  <script
    src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"
    referrerpolicy="no-referrer"
  ></script>

  <style>
    /* Reset / base */
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      overscroll-behavior: none;
    }

    /* Reading progress bar */
    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      z-index: 100;
      width: 0;
      transition: width 0.2s;
    }

    /* Layout */
    #pdf-viewer {
      overflow-y: auto;
      background: #f9fafb;
    }
    #map-container {
      background: #e5e7eb;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    /* PDF pages */
    .pdf-container {
      max-width: 100%;
      padding: 20px;
    }
    .pdf-page-wrapper {
      position: relative;
      margin-bottom: 40px;
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .pdf-canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    .page-number {
      text-align: center;
      color: #9ca3af;
      font-size: 0.875rem;
      padding: 10px;
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
    }
    .page-loading {
      padding: 2.5rem 1rem;
      text-align: center;
      color: #6b7280;
      font-size: 0.95rem;
      background: linear-gradient(180deg, #ffffff 0%, #f9fafb 100%);
    }

    /* Text overlay / location badges */
    .text-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    .location-badge {
      position: absolute;
      background: rgba(59, 130, 246, 0.15);
      border: 1.5px solid rgba(59, 130, 246, 0.6);
      border-radius: 4px;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.2s ease;
      box-shadow: 0 2px 6px rgba(59, 130, 246, 0.25);
    }
    .location-badge::after {
      content: attr(data-location);
      position: absolute;
      top: -18px;
      left: 0;
      background: rgba(59, 130, 246, 0.9);
      color: white;
      padding: 2px 6px;
      font-size: 10px;
      border-radius: 4px;
      white-space: nowrap;
      box-shadow: 0 1px 4px rgba(0, 0, 0, 0.2);
    }
    .location-badge:hover {
      background: rgba(59, 130, 246, 0.25);
      transform: scale(1.03);
      box-shadow: 0 3px 8px rgba(59, 130, 246, 0.35);
      z-index: 10;
    }
    .location-badge.active {
      background: rgba(239, 68, 68, 0.25);
      border-color: rgba(239, 68, 68, 0.75);
      box-shadow: 0 4px 12px rgba(239, 68, 68, 0.45);
      z-index: 15;
    }

    .map-tools {
      position: absolute;
      top: 1rem;
      right: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.5rem;
      z-index: 400;
    }
    .map-tools button {
      font-size: 0.75rem;
      padding: 0.4rem 0.6rem;
      border-radius: 0.5rem;
      background: #ffffff;
      border: 1px solid #e5e7eb;
      box-shadow: 0 4px 10px rgba(15, 23, 42, 0.1);
    }
    .map-tools button:hover {
      background: #f3f4f6;
    }

    .map-active-page {
      font-size: 0.7rem;
      color: #4b5563;
      text-align: center;
      background: #f9fafb;
      border-radius: 0.5rem;
      padding: 0.3rem 0.5rem;
      border: 1px solid #e5e7eb;
    }

    .focus-ring:focus-visible,
    button:focus-visible,
    [role="button"]:focus-visible,
    #timeline-bar:focus-visible {
      outline: 3px solid rgba(59, 130, 246, 0.8);
      outline-offset: 2px;
    }

    /* Resize handle */
    .resize-handle {
      display: none;
      background: linear-gradient(
        to right,
        #e5e7eb 0%,
        #9ca3af 50%,
        #e5e7eb 100%
      );
      cursor: ew-resize;
      z-index: 20;
      touch-action: none;
    }
    .resize-handle::before {
      content: "⋮⋮";
      color: white;
      font-size: 0.75rem;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    /* Desktop: side-by-side, vertical resize handle */
    @media (min-width: 769px) {
      #pdf-viewer,
      #map-container {
        height: calc(100vh - 4rem);
      }
      .resize-handle {
        display: block;
        width: 10px;
        height: 100%;
        position: relative;
      }
    }

    /* Mobile: stacked, horizontal resize handle */
    @media (max-width: 768px) {
      nav {
        position: relative !important;
      }
      .nav-controls {
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .nav-controls button {
        font-size: 0.75rem !important;
        padding: 0.5rem !important;
      }
      .main-content {
        flex-direction: column !important;
        padding-top: 0 !important;
      }
      #pdf-viewer,
      #map-container {
        width: 100% !important;
        height: 50vh !important;
        position: relative !important;
      }
      .resize-handle {
        display: block;
        width: 100%;
        height: 10px;
        background: linear-gradient(
          to bottom,
          #e5e7eb 0%,
          #9ca3af 50%,
          #e5e7eb 100%
        );
        cursor: ns-resize;
        position: relative;
      }
      .resize-handle::before {
        content: "⋯⋯";
      }
    }

    /* Timeline controls */
    .timeline-controls {
      width: 90%;
      padding: 0.5rem;
    }
  </style>
</head>
<body class="bg-gray-100">
  <!-- Reading Progress -->
  <div class="reading-progress" id="readingProgress"></div>

  <!-- Nav -->
  <nav class="bg-white shadow-md fixed w-full z-10">
    <div class="max-w-7xl mx-auto px-2 sm:px-4 lg:px-6">
      <div class="flex justify-between h-auto md:h-16 py-2 md:py-0">
        <div class="flex items-center">
          <i data-feather="map" class="text-red-600 mr-2 w-5 h-5"></i>
          <span class="text-lg md:text-xl font-bold text-gray-800">
            ScrollThroughTime
          </span>
        </div>
        <div class="flex items-center flex-wrap gap-2 nav-controls">
          <button
            id="upload-btn"
            class="px-3 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition flex items-center text-sm"
            aria-label="Upload PDF"
          >
            <i data-feather="upload" class="mr-1 w-4 h-4"></i>
            Upload
          </button>
          <button
            id="generate-test-pdf"
            class="px-3 py-2 bg-green-500 text-white rounded-md hover:bg-green-600 transition flex items-center text-sm"
            aria-label="Generate test PDF"
          >
            <i data-feather="file-text" class="mr-1 w-4 h-4"></i>
            Test
          </button>
          <button
            id="auto-map-toggle"
            class="px-3 py-2 bg-teal-500 text-white rounded-md hover:bg-teal-600 transition text-sm"
            aria-label="Toggle auto map navigation"
          >
            Auto ON
          </button>
          <input
            type="file"
            id="pdf-input"
            accept=".pdf"
            class="hidden"
          />
          <input
            type="file"
            id="trace-import"
            accept=".json,.geojson,application/geo+json"
            class="hidden"
          />
        </div>
      </div>
    </div>
  </nav>

  <!-- Main content -->
  <div class="pt-0 md:pt-16 pb-8 flex flex-col md:flex-row main-content">
    <!-- PDF viewer -->
    <div
      id="pdf-viewer"
      class="w-full md:w-1/2 h-screen overflow-y-auto bg-gray-50"
    >
      <div
        id="pdf-placeholder"
        class="text-center py-20 text-gray-500"
      >
        <i data-feather="file" class="w-12 h-12 mx-auto mb-4"></i>
        <h3 class="text-xl font-medium">No PDF Loaded</h3>
        <p class="mt-2">Upload a PDF or click Test to begin</p>
      </div>
      <div id="pdf-container" class="pdf-container hidden"></div>
    </div>

    <!-- Resize handle -->
    <div id="resizeHandle" class="resize-handle"></div>

    <!-- Map -->
    <div
      id="map-container"
      class="w-full md:w-1/2 h-screen sticky top-16 relative"
    >
      <div id="map"></div>
      <div class="map-tools">
        <div class="map-active-page">
          Trace page: <span id="trace-page-label">1</span>
        </div>
        <button id="trace-clear" type="button" class="focus-ring">
          Clear Page
        </button>
        <button id="trace-export-page" type="button" class="focus-ring">
          Export Page
        </button>
        <button id="trace-export-all" type="button" class="focus-ring">
          Export All
        </button>
        <button id="trace-import-btn" type="button" class="focus-ring">
          Import
        </button>
      </div>
    </div>
  </div>

  <!-- Timeline controls -->
  <div
    class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-white p-3 rounded-lg shadow-xl flex items-center space-x-4 z-10 timeline-controls"
  >
    <button
      id="prev-marker"
      class="p-2 rounded-full bg-gray-200 hover:bg-gray-300 transition"
      aria-label="Previous location"
    >
      <i data-feather="chevron-left" class="w-4 h-4"></i>
    </button>

    <div
      id="timeline-bar"
      class="w-32 md:w-64 h-2 bg-gray-200 rounded-full relative cursor-pointer"
      tabindex="0"
      role="slider"
      aria-label="Location timeline"
      aria-valuemin="1"
      aria-valuenow="0"
      aria-valuemax="0"
    >
      <div
        id="timeline-progress"
        class="absolute top-0 left-0 h-full bg-blue-600 rounded-full transition-all duration-300"
        style="width: 0"
      ></div>
    </div>

    <button
      id="next-marker"
      class="p-2 rounded-full bg-gray-200 hover:bg-gray-300 transition"
      aria-label="Next location"
    >
      <i data-feather="chevron-right" class="w-4 h-4"></i>
    </button>

    <span class="text-sm font-medium">
      <span id="marker-counter">0/0</span>
    </span>
    <span class="text-xs text-gray-500" id="current-location" aria-live="polite">
      No location selected
    </span>
  </div>

  <script>
    // Ensure PDF.js worker is configured
    if (typeof window.pdfjsLib !== "undefined") {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    }

    const state = {
      pdfDoc: null,
      map: null,
      regionPolygons: [],
      autoMap: true,
      allLocations: [],
      currentLocationIndex: 0,
      isResizing: false,
      activeMapMarker: null,
      activeRegionPolygon: null,
      locationRegexes: [],
      pageRenderState: new Map(),
      pageElements: new Map(),
      renderObserver: null,
      visiblePages: new Map(),
      activePage: 1,
      pageTraces: new Map(),
      activeTraceLayer: null,
      drawControl: null,
    };

    const MAX_PDF_SIZE = 50 * 1024 * 1024;

    // Geo database
    const geoDatabase = {
      Constantinople: [41.0082, 28.9784],
      Istanbul: [41.0082, 28.9784],
      Moscow: [55.7558, 37.6173],
      Crimea: [45.0, 34.0],
      "Black Sea": [43.0, 35.0],
      Azov: [47.1, 39.4],
      Sevastopol: [44.6167, 33.525],
      Kiev: [50.4501, 30.5234],
      Vienna: [48.2082, 16.3738],
      Danube: [45.0, 29.0],
      Volga: [55.0, 49.0],
      Athens: [37.9838, 23.7275],
      Varna: [43.2141, 27.9147],
      Sofia: [42.6977, 23.3219],
      Belgrade: [44.7866, 20.4489],
      Bucharest: [44.4268, 26.1025],
      Odessa: [46.4825, 30.7233],
      Erzurum: [39.9, 41.2667],
      Cairo: [30.0444, 31.2357],
      Baghdad: [33.3152, 44.3661],
      Damascus: [33.5138, 36.2765],
      Mohacs: [45.9928, 18.6839],
      Hungary: [47.1625, 19.5033],
      German: [51.1657, 10.4515],
      Germany: [51.1657, 10.4515],
      Habsburg: [48.2082, 16.3738],
      Austria: [47.5162, 14.5501],
    };

    const regionPolygons = {
      Anatolia: {
        coords: [
          [36.0, 26.0],
          [41.5, 26.0],
          [42.0, 40.0],
          [37.0, 44.5],
          [36.0, 26.0],
        ],
        color: "#3b82f6",
      },
      Balkans: {
        coords: [
          [37.0, 19.0],
          [46.0, 13.0],
          [47.0, 22.0],
          [40.0, 28.0],
          [37.0, 21.0],
        ],
        color: "#8b5cf6",
      },
      Caucasus: {
        coords: [
          [40.0, 38.0],
          [44.0, 48.0],
          [40.0, 48.0],
          [40.0, 38.0],
        ],
        color: "#10b981",
      },
    };

    function escapeRegex(value) {
      return value.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
    }

    function buildLocationRegexes() {
      const locationNames = new Set([
        ...Object.keys(geoDatabase),
        ...Object.keys(regionPolygons),
      ]);
      state.locationRegexes = Array.from(locationNames).map((name) => ({
        name,
        regex: new RegExp(
          `(^|\\\\W)(${escapeRegex(name)})(?=\\\\W|$)`,
          "gi"
        ),
      }));
    }

    function getTraceLayer(pageNum) {
      if (!state.pageTraces.has(pageNum)) {
        state.pageTraces.set(pageNum, new L.FeatureGroup());
      }
      return state.pageTraces.get(pageNum);
    }

    function setActiveTracePage(pageNum) {
      if (!state.map || !pageNum) return;
      const layer = getTraceLayer(pageNum);
      if (state.activeTraceLayer && state.map.hasLayer(state.activeTraceLayer)) {
        state.map.removeLayer(state.activeTraceLayer);
      }
      state.activeTraceLayer = layer;
      if (!state.map.hasLayer(layer)) {
        state.map.addLayer(layer);
      }

      if (state.drawControl) {
        state.map.removeControl(state.drawControl);
      }
      state.drawControl = new L.Control.Draw({
        edit: { featureGroup: layer },
        draw: {
          polygon: true,
          polyline: true,
          rectangle: true,
          circle: false,
          marker: true,
          circlemarker: false,
        },
      });
      state.map.addControl(state.drawControl);
      updateTraceStateLabel();
    }

    function updateTraceStateLabel() {
      const label = document.getElementById("trace-page-label");
      if (label) {
        label.textContent = String(state.activePage || 1);
      }
    }

    function setActivePage(pageNum) {
      if (!pageNum) return;
      state.activePage = pageNum;
      setActiveTracePage(pageNum);
    }

    function initMap() {
      state.map = L.map("map").setView([45, 25], 5);
      const baseLayers = {
        OpenStreetMap: L.tileLayer(
          "https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png",
          {
            maxZoom: 18,
            attribution: "© OpenStreetMap",
          }
        ),
        "Esri World Imagery": L.tileLayer(
          "https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}",
          {
            maxZoom: 18,
            attribution: "Tiles © Esri",
          }
        ),
        "Carto Light": L.tileLayer(
          "https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png",
          {
            maxZoom: 19,
            attribution: "© OpenStreetMap © CARTO",
          }
        ),
      };
      baseLayers.OpenStreetMap.addTo(state.map);
      L.control.layers(baseLayers, null, { position: "topleft" }).addTo(
        state.map
      );

      // Add region polygons
      Object.keys(regionPolygons).forEach((name) => {
        const region = regionPolygons[name];
        const polygon = L.polygon(region.coords, {
          color: region.color,
          fillColor: region.color,
          fillOpacity: 0,
          weight: 2,
          opacity: 0,
        }).addTo(state.map);
        polygon.bindPopup("<b>" + name + "</b>");
        polygon.regionName = name;
        state.regionPolygons.push(polygon);
      });

      initDrawControls();
    }

    function initDrawControls() {
      if (!state.map || !L.Control.Draw) return;
      state.map.on(L.Draw.Event.CREATED, (event) => {
        if (state.activeTraceLayer) {
          state.activeTraceLayer.addLayer(event.layer);
        }
      });
      state.map.on(L.Draw.Event.DELETED, () => {
        updateTraceStateLabel();
      });
      setActiveTracePage(state.activePage);
    }

    function handleLocationClick(locationName, element) {
      const regionDef = regionPolygons[locationName];
      const coords = geoDatabase[locationName];
      if (!coords && !regionDef) return;
      const wrapper = element.closest(".pdf-page-wrapper");
      if (wrapper) {
        const pageNum = Number(wrapper.dataset.page);
        if (pageNum) {
          setActivePage(pageNum);
        }
      }

      // Update active badge
      document
        .querySelectorAll(".location-badge")
        .forEach((el) => el.classList.remove("active"));
      element.classList.add("active");

      // Update current index for timeline
      const idx = state.allLocations.findIndex(
        (loc) => loc.name === locationName && loc.element === element
      );
      if (idx !== -1) {
        state.currentLocationIndex = idx;
        updateTimeline();
      }

      if (!state.autoMap || !state.map) return;

      // Clear existing map highlights
      if (state.activeMapMarker) {
        state.map.removeLayer(state.activeMapMarker);
        state.activeMapMarker = null;
      }
      if (state.activeRegionPolygon) {
        state.activeRegionPolygon.setStyle({
          fillOpacity: 0,
          opacity: 0,
          weight: 2,
        });
        state.activeRegionPolygon = null;
      }

      // Handle region polygons vs points
      if (regionDef) {
        const poly = state.regionPolygons.find(
          (p) => p.regionName === locationName
        );
        if (poly) {
          state.regionPolygons.forEach((p) =>
            p.setStyle({ fillOpacity: 0, opacity: 0, weight: 2 })
          );
          poly.setStyle({
            fillOpacity: 0.35,
            opacity: 0.9,
            weight: 3,
          });
          state.activeRegionPolygon = poly;
          state.map.fitBounds(poly.getBounds());
        }
      } else {
        state.map.setView(coords, 8);
        const marker = L.circleMarker(coords, {
          radius: 15,
          fillColor: "#ef4444",
          color: "#ffffff",
          weight: 3,
          fillOpacity: 0.7,
        })
          .addTo(state.map)
          .bindPopup("<b>" + locationName + "</b>")
          .openPopup();

        state.activeMapMarker = marker;
      }
    }

    async function renderAllPages() {
      const container = document.getElementById("pdf-container");
      container.innerHTML = "";
      state.allLocations = [];
      state.pageRenderState = new Map();
      state.pageElements = new Map();
      state.visiblePages = new Map();
      state.currentLocationIndex = 0;

      if (state.renderObserver) {
        state.renderObserver.disconnect();
      }

      const viewer = document.getElementById("pdf-viewer");
      state.renderObserver = new IntersectionObserver(
        (entries) => {
          entries.forEach((entry) => {
            const pageNum = Number(entry.target.dataset.page);
            if (entry.isIntersecting) {
              state.visiblePages.set(pageNum, entry.intersectionRatio);
              renderPage(pageNum);
            } else {
              state.visiblePages.delete(pageNum);
            }
          });
          const sorted = Array.from(state.visiblePages.entries()).sort(
            (a, b) => b[1] - a[1]
          );
          if (sorted.length) {
            setActivePage(sorted[0][0]);
          }
        },
        {
          root: viewer,
          threshold: [0, 0.2, 0.6, 1],
        }
      );

      console.log("Preparing PDF pages…");
      for (let pageNum = 1; pageNum <= state.pdfDoc.numPages; pageNum++) {
        state.pageRenderState.set(pageNum, { rendered: false, rendering: false });

        const pageWrapper = document.createElement("div");
        pageWrapper.className = "pdf-page-wrapper";
        pageWrapper.dataset.page = pageNum;

        const pageNumber = document.createElement("div");
        pageNumber.className = "page-number";
        pageNumber.textContent = "Page " + pageNum;
        pageWrapper.appendChild(pageNumber);

        const canvasContainer = document.createElement("div");
        canvasContainer.style.position = "relative";
        canvasContainer.style.width = "100%";

        const canvas = document.createElement("canvas");
        canvas.className = "pdf-canvas";
        canvasContainer.appendChild(canvas);

        const loading = document.createElement("div");
        loading.className = "page-loading";
        loading.textContent = "Loading page…";
        canvasContainer.appendChild(loading);

        const textOverlay = document.createElement("div");
        textOverlay.className = "text-overlay";
        canvasContainer.appendChild(textOverlay);

        pageWrapper.appendChild(canvasContainer);
        container.appendChild(pageWrapper);

        state.pageElements.set(pageNum, {
          canvas,
          canvasContainer,
          textOverlay,
          loading,
        });

        state.renderObserver.observe(pageWrapper);
      }

      updateTimeline();
      rescaleOverlays();
    }

    async function renderPage(pageNum) {
      const renderState = state.pageRenderState.get(pageNum);
      if (!renderState || renderState.rendered || renderState.rendering) return;
      renderState.rendering = true;

      const elements = state.pageElements.get(pageNum);
      if (!elements) {
        renderState.rendering = false;
        return;
      }

      const page = await state.pdfDoc.getPage(pageNum);
      const scale = 1.5;
      const viewport = page.getViewport({ scale });
      const { canvas, canvasContainer, textOverlay, loading } = elements;
      const ctx = canvas.getContext("2d");

      canvas.width = viewport.width;
      canvas.height = viewport.height;
      await page.render({ canvasContext: ctx, viewport }).promise;
      if (loading) {
        loading.remove();
      }

      const displayWidth = canvas.clientWidth || canvas.width;
      const displayScale = displayWidth / viewport.width || 1;
      const displayHeight = viewport.height * displayScale;
      canvasContainer.style.height = displayHeight + "px";
      textOverlay.style.width = displayWidth + "px";
      textOverlay.style.height = displayHeight + "px";
      textOverlay.dataset.viewportWidth = viewport.width;
      textOverlay.dataset.viewportHeight = viewport.height;

      const textContent = await page.getTextContent();
      textOverlay.innerHTML = "";

      textContent.items.forEach((item) => {
        const rawText = (item.str || "").trim();
        if (!rawText) return;

        const rawTransform = item.transform || [];
        const transform = pdfjsLib.Util.transform(
          viewport.transform,
          rawTransform
        );
        const fontHeight = Math.hypot(transform[1] || 0, transform[3] || 0);
        const textWidthPx = (item.width || 0) * viewport.scale;
        const leftBase = transform[4] || 0;
        const topBase = (transform[5] || 0) - fontHeight;

        state.locationRegexes.forEach(({ name, regex }) => {
          const matches = rawText.matchAll(regex);
          Array.from(matches).forEach((match) => {
            const startIndex = (match.index || 0) + (match[1] || "").length;
            const wordLength = match[2].length;
            const textLength = rawText.length || 1;

            const startFraction = startIndex / textLength;
            const widthFraction = wordLength / textLength;

            const highlightWidthBase = textWidthPx * widthFraction;
            const leftOffsetBase = leftBase + textWidthPx * startFraction;
            const highlightHeightBase = fontHeight || 14;
            const topOffsetBase = topBase;

            const highlight = document.createElement("div");
            highlight.className = "location-badge";
            highlight.dataset.location = name;
            highlight.dataset.left = leftOffsetBase;
            highlight.dataset.top = topOffsetBase;
            highlight.dataset.width = highlightWidthBase;
            highlight.dataset.height = highlightHeightBase;

            highlight.style.left = leftOffsetBase * displayScale + "px";
            highlight.style.top = topOffsetBase * displayScale + "px";
            highlight.style.width = highlightWidthBase * displayScale + "px";
            highlight.style.height = highlightHeightBase * displayScale + "px";
            highlight.title = "Click to view location on map";

            highlight.onclick = () => handleLocationClick(name, highlight);

            textOverlay.appendChild(highlight);

            state.allLocations.push({
              name,
              element: highlight,
              page: pageNum,
            });
          });
        });
      });

      renderState.rendered = true;
      renderState.rendering = false;
      state.allLocations.sort(
        (a, b) =>
          a.page - b.page || a.element.offsetTop - b.element.offsetTop
      );
      updateTimeline();
      rescaleOverlays();
    }

    function updateTimeline() {
      const total = state.allLocations.length;
      const counter = document.getElementById("marker-counter");
      const currentLabel = document.getElementById("current-location");
      const timelineBar = document.getElementById("timeline-bar");
      counter.textContent =
        (total === 0 ? 0 : state.currentLocationIndex + 1) + "/" + total;

      if (total === 0) {
        document.getElementById("timeline-progress").style.width = "0";
        if (currentLabel) {
          currentLabel.textContent = "No location selected";
        }
        if (timelineBar) {
          timelineBar.setAttribute("aria-valuenow", "0");
          timelineBar.setAttribute("aria-valuemax", "0");
        }
        return;
      }

      state.currentLocationIndex = Math.min(
        state.currentLocationIndex,
        total - 1
      );

      const progress =
        (state.currentLocationIndex /
          Math.max(total - 1, 1)) *
        100;
      document.getElementById("timeline-progress").style.width =
        progress + "%";
      if (currentLabel) {
        const current = state.allLocations[state.currentLocationIndex];
        currentLabel.textContent = current
          ? `${current.name} · Page ${current.page}`
          : "No location selected";
      }
      if (timelineBar) {
        timelineBar.setAttribute(
          "aria-valuenow",
          String(state.currentLocationIndex + 1)
        );
        timelineBar.setAttribute("aria-valuemax", String(total));
      }
    }

    function rescaleOverlays() {
      document.querySelectorAll(".pdf-page-wrapper").forEach((wrapper) => {
        const canvas = wrapper.querySelector("canvas");
        const overlay = wrapper.querySelector(".text-overlay");
        const canvasContainer = canvas?.parentElement;

        if (!canvas || !overlay || !canvasContainer) return;

        const viewportWidth = Number(overlay.dataset.viewportWidth) || 1;
        const viewportHeight = Number(overlay.dataset.viewportHeight) || 1;
        const displayScale = canvas.clientWidth / viewportWidth;
        const displayHeight = viewportHeight * displayScale;

        overlay.style.width = canvas.clientWidth + "px";
        overlay.style.height = displayHeight + "px";
        canvasContainer.style.height = displayHeight + "px";

        overlay.querySelectorAll(".location-badge").forEach((badge) => {
          const left = Number(badge.dataset.left) || 0;
          const top = Number(badge.dataset.top) || 0;
          const width = Number(badge.dataset.width) || 0;
          const height = Number(badge.dataset.height) || 0;

          badge.style.left = left * displayScale + "px";
          badge.style.top = top * displayScale + "px";
          badge.style.width = width * displayScale + "px";
          badge.style.height = height * displayScale + "px";
        });
      });
    }

    function navigateToLocation(index) {
      if (index < 0 || index >= state.allLocations.length) return;
      state.currentLocationIndex = index;
      const location = state.allLocations[index];

      setActivePage(location.page);
      location.element.scrollIntoView({
        behavior: "smooth",
        block: "center",
      });

      handleLocationClick(location.name, location.element);
    }

    function updateReadingProgress() {
      const viewer = document.getElementById("pdf-viewer");
      if (!viewer) return;
      const scrollPercent =
        (viewer.scrollTop /
          (viewer.scrollHeight - viewer.clientHeight || 1)) *
        100;
      document.getElementById("readingProgress").style.width =
        Math.min(scrollPercent, 100) + "%";
    }

    async function loadPDF(fileOrBlob) {
      try {
        if (typeof window.pdfjsLib === "undefined") {
          throw new Error("PDF.js library not loaded");
        }

        let arrayBuffer;
        if (fileOrBlob instanceof Blob) {
          if (fileOrBlob.size > MAX_PDF_SIZE) {
            throw new Error("PDF exceeds the 50MB size limit.");
          }
          arrayBuffer = await fileOrBlob.arrayBuffer();
        } else {
          // File from input
          if (fileOrBlob.size > MAX_PDF_SIZE) {
            throw new Error("PDF exceeds the 50MB size limit.");
          }
          arrayBuffer = await fileOrBlob.arrayBuffer();
        }

        const loadingTask = window.pdfjsLib.getDocument({
          data: new Uint8Array(arrayBuffer),
        });
        state.pdfDoc = await loadingTask.promise;

        document
          .getElementById("pdf-placeholder")
          .classList.add("hidden");
        document
          .getElementById("pdf-container")
          .classList.remove("hidden");

        if (state.activeTraceLayer && state.map) {
          state.map.removeLayer(state.activeTraceLayer);
        }
        state.pageTraces = new Map();
        state.activeTraceLayer = null;
        setActivePage(1);
        await renderAllPages();
      } catch (error) {
        alert("Error loading PDF: " + error.message);
        console.error("PDF Error", error);
      }
    }

    function generateTestPDF() {
      if (!window.jspdf) {
        alert("jsPDF library not loaded");
        return;
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      // Page 1
      doc.setFontSize(16);
      doc.text("The Battle of Mohacs 1526", 20, 20);
      doc.setFontSize(12);
      doc.text(
        "Near Hungary, Ottoman forces defeated Habsburg.",
        20,
        40
      );
      doc.text(
        "The march continued toward Vienna and the Danube.",
        20,
        50
      );
      doc.text(
        "German resistance formed as Constantinople directed.",
        20,
        60
      );

      // Page 2
      doc.addPage();
      doc.setFontSize(16);
      doc.text("Ottoman Expansion", 20, 20);
      doc.setFontSize(12);
      doc.text(
        "Key cities: Constantinople, Moscow, Cairo, Baghdad.",
        20,
        40
      );
      doc.text("Regions: Anatolia, Balkans, and Caucasus.", 20, 50);
      doc.text(
        "Strategic areas: Black Sea and Crimea.",
        20,
        60
      );

      // Page 3
      doc.addPage();
      doc.setFontSize(16);
      doc.text("Later Campaigns", 20, 20);
      doc.setFontSize(12);
      doc.text(
        "Extended to Damascus and Baghdad in the east.",
        20,
        40
      );
      doc.text(
        "Cities: Belgrade, Bucharest, Odessa, Sevastopol.",
        20,
        50
      );
      doc.text(
        "Struggle for Austria and Vienna continued.",
        20,
        60
      );

      const blob = doc.output("blob");
      loadPDF(blob);
    }

    function downloadJson(payload, filename) {
      const blob = new Blob([JSON.stringify(payload, null, 2)], {
        type: "application/json",
      });
      const url = URL.createObjectURL(blob);
      const link = document.createElement("a");
      link.href = url;
      link.download = filename;
      document.body.appendChild(link);
      link.click();
      link.remove();
      URL.revokeObjectURL(url);
    }

    function exportTracePage() {
      if (!state.activePage) return;
      const layer = getTraceLayer(state.activePage);
      const data = layer.toGeoJSON();
      downloadJson(data, `traces-page-${state.activePage}.geojson`);
    }

    function exportAllTraces() {
      const payload = { pages: {} };
      state.pageTraces.forEach((layer, pageNum) => {
        payload.pages[pageNum] = layer.toGeoJSON();
      });
      downloadJson(payload, "traces-all-pages.json");
    }

    function applyGeoJsonToPage(pageNum, data) {
      const layerGroup = getTraceLayer(pageNum);
      L.geoJSON(data).eachLayer((layer) => {
        layerGroup.addLayer(layer);
      });
      if (pageNum === state.activePage) {
        setActiveTracePage(pageNum);
      }
    }

    function importTraces(file) {
      const reader = new FileReader();
      reader.onload = () => {
        try {
          const data = JSON.parse(reader.result);
          if (data.pages && typeof data.pages === "object") {
            Object.keys(data.pages).forEach((pageKey) => {
              applyGeoJsonToPage(Number(pageKey), data.pages[pageKey]);
            });
          } else {
            applyGeoJsonToPage(state.activePage || 1, data);
          }
        } catch (error) {
          alert("Invalid trace file: " + error.message);
        }
      };
      reader.readAsText(file);
    }

    function initResizer() {
      const handle = document.getElementById("resizeHandle");
      const pdfViewer = document.getElementById("pdf-viewer");
      const mapContainer = document.getElementById("map-container");

      let startY = 0;
      let startX = 0;
      let startHeightPdf = 0;
      let startWidthPdf = 0;

      function startResize(e) {
        state.isResizing = true;
        const isTouch = e.type === "touchstart";
        startY = isTouch ? e.touches[0].clientY : e.clientY;
        startX = isTouch ? e.touches[0].clientX : e.clientX;
        startHeightPdf = pdfViewer.offsetHeight;
        startWidthPdf = pdfViewer.offsetWidth;

        document.addEventListener("mousemove", resize);
        document.addEventListener("touchmove", resize);
        document.addEventListener("mouseup", stopResize);
        document.addEventListener("touchend", stopResize);
        e.preventDefault();
      }

      function resize(e) {
        if (!state.isResizing) return;
        const isTouch = e.type === "touchmove";

        if (window.innerWidth <= 768) {
          // Vertical resize (stacked)
          const currentY = isTouch ? e.touches[0].clientY : e.clientY;
          const newHeight = startHeightPdf + (currentY - startY);
          const minHeight = window.innerHeight * 0.2;
          const maxHeight = window.innerHeight * 0.8;

          const clamped = Math.max(minHeight, Math.min(maxHeight, newHeight));
          pdfViewer.style.height = clamped + "px";
          mapContainer.style.height =
            window.innerHeight - clamped - 10 + "px";
        } else {
          // Horizontal resize (side-by-side)
          const currentX = isTouch ? e.touches[0].clientX : e.clientX;
          const newWidth = startWidthPdf + (currentX - startX);
          const minWidth = window.innerWidth * 0.2;
          const maxWidth = window.innerWidth * 0.8;

          const clamped = Math.max(minWidth, Math.min(maxWidth, newWidth));
          pdfViewer.style.width = clamped + "px";
          mapContainer.style.width =
            window.innerWidth - clamped - 10 + "px";

          if (state.map) {
            state.map.invalidateSize();
          }

          rescaleOverlays();
        }
      }

      function stopResize() {
        state.isResizing = false;
        document.removeEventListener("mousemove", resize);
        document.removeEventListener("touchmove", resize);
        document.removeEventListener("mouseup", stopResize);
        document.removeEventListener("touchend", stopResize);
      }

      handle.addEventListener("mousedown", startResize);
      handle.addEventListener("touchstart", startResize, {
        passive: false,
      });
    }

    // Event listeners
    document
      .getElementById("upload-btn")
      .addEventListener("click", () =>
        document.getElementById("pdf-input").click()
      );

    document
      .getElementById("pdf-input")
      .addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        if (file.size > MAX_PDF_SIZE) {
          alert("PDF exceeds the 50MB size limit.");
          e.target.value = "";
          return;
        }
        loadPDF(file);
      });

    document
      .getElementById("generate-test-pdf")
      .addEventListener("click", generateTestPDF);

    document
      .getElementById("auto-map-toggle")
      .addEventListener("click", (e) => {
        state.autoMap = !state.autoMap;
        e.target.textContent = "Auto " + (state.autoMap ? "ON" : "OFF");
        e.target.classList.toggle("bg-teal-500", state.autoMap);
        e.target.classList.toggle("bg-gray-400", !state.autoMap);
      });

    document
      .getElementById("prev-marker")
      .addEventListener("click", () => {
        if (state.currentLocationIndex > 0) {
          navigateToLocation(state.currentLocationIndex - 1);
        }
      });

    document
      .getElementById("next-marker")
      .addEventListener("click", () => {
        if (
          state.currentLocationIndex <
          state.allLocations.length - 1
        ) {
          navigateToLocation(state.currentLocationIndex + 1);
        }
      });

    document
      .getElementById("timeline-bar")
      .addEventListener("click", (e) => {
        if (!state.allLocations.length) return;
        const rect = e.currentTarget.getBoundingClientRect();
        const percent = (e.clientX - rect.left) / rect.width;
        const targetIndex = Math.floor(percent * state.allLocations.length);
        navigateToLocation(
          Math.min(targetIndex, state.allLocations.length - 1)
        );
      });

    document
      .getElementById("timeline-bar")
      .addEventListener("keydown", (e) => {
        if (!state.allLocations.length) return;
        if (e.key === "ArrowLeft") {
          navigateToLocation(Math.max(state.currentLocationIndex - 1, 0));
          e.preventDefault();
        }
        if (e.key === "ArrowRight") {
          navigateToLocation(
            Math.min(
              state.currentLocationIndex + 1,
              state.allLocations.length - 1
            )
          );
          e.preventDefault();
        }
      });

    document
      .getElementById("trace-clear")
      .addEventListener("click", () => {
        if (!state.activeTraceLayer) return;
        state.activeTraceLayer.clearLayers();
      });

    document
      .getElementById("trace-export-page")
      .addEventListener("click", exportTracePage);

    document
      .getElementById("trace-export-all")
      .addEventListener("click", exportAllTraces);

    document
      .getElementById("trace-import-btn")
      .addEventListener("click", () =>
        document.getElementById("trace-import").click()
      );

    document
      .getElementById("trace-import")
      .addEventListener("change", (e) => {
        const file = e.target.files && e.target.files[0];
        if (!file) return;
        importTraces(file);
        e.target.value = "";
      });

    document
      .getElementById("pdf-viewer")
      .addEventListener("scroll", updateReadingProgress);

    window.addEventListener("resize", rescaleOverlays);

    // Init
    buildLocationRegexes();
    initMap();
    initResizer();
    feather.replace();
    console.log("ScrollThroughTime initialized");
  </script>
