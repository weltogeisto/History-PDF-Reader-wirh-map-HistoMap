<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, user-scalable=yes">
  <meta name="theme-color" content="#3b82f6">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>ScrollThroughTime</title>
  <link rel="manifest" href="manifest.json">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config = { darkMode: 'class' }</script>
  <script src="https://unpkg.com/feather-icons"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.css">
  <link rel="stylesheet" href="https://unpkg.com/leaflet.markercluster@1.4.1/dist/MarkerCluster.Default.css">
  <script src="https://unpkg.com/leaflet.markercluster@1.4.1/dist/leaflet.markercluster.js"></script>
  <script src="https://unpkg.com/leaflet.heat@0.2.0/dist/leaflet-heat.js"></script>
  <script src="https://unpkg.com/jspdf@2.5.1/dist/jspdf.umd.min.js"></script>
  <script src="https://unpkg.com/pdfjs-dist@3.11.174/build/pdf.min.js"></script>
  <script src="https://unpkg.com/tesseract.js@5.0.4/dist/tesseract.min.js"></script>
  <script src="https://unpkg.com/hammerjs@2.0.8/hammer.min.js"></script>
  <script src="https://unpkg.com/localforage@1.10.0/dist/localforage.min.js"></script>
  <script src="https://unpkg.com/epubjs@0.3.93/dist/epub.min.js"></script>
  <style>
    :root {
      --primary: #3b82f6;
      --primary-dark: #1d4ed8;
      --bg-dark: #0f172a;
      --surface-dark: #1e293b;
      --text-light: #f1f5f9;
      --nav-height: 64px;
      --bottom-nav-height: 70px;
    }
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      font-family: system-ui, -apple-system, sans-serif;
      overscroll-behavior: none;
      background: var(--bg-dark);
      color: var(--text-light);
      padding-bottom: var(--bottom-nav-height);
    }
    /* Reading Progress */
    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6, #ec4899);
      z-index: 100;
      width: 0;
      transition: width 0.2s;
      pointer-events: none;
    }
    /* Header */
    .app-header {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-height);
      background: linear-gradient(135deg, var(--surface-dark), var(--bg-dark));
      backdrop-filter: blur(10px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 50;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 16px;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .app-header.nav-hidden {
      transform: translateY(-100%);
    }
    .app-logo {
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .app-logo span {
      font-size: 1.25rem;
      font-weight: 700;
    }
    .header-actions {
      display: flex;
      gap: 8px;
    }
    .header-btn {
      width: 40px;
      height: 40px;
      border-radius: 12px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .header-btn:hover {
      background: rgba(255, 255, 255, 0.2);
      transform: scale(1.05);
    }
    .header-btn:active {
      transform: scale(0.95);
    }
    /* Mobile: collapse header actions */
    .show-mobile-only {
      display: none !important;
    }
    @media (max-width: 480px) {
      .app-logo span:last-child {
        font-size: 1rem;
      }
      .header-btn.hide-mobile {
        display: none;
      }
      .header-actions {
        gap: 4px;
      }
      .header-btn {
        width: 36px;
        height: 36px;
      }
      .show-mobile-only {
        display: flex !important;
      }
      .menu-divider.show-mobile-only {
        display: block !important;
      }
    }
    /* Main Content Area */
    .main-content {
      margin-top: var(--nav-height);
      min-height: calc(100vh - var(--nav-height) - var(--bottom-nav-height));
    }
    /* PDF Viewer */
    #pdf-viewer {
      width: 100%;
      height: calc(100vh - var(--nav-height) - var(--bottom-nav-height));
      overflow-y: auto;
      scroll-behavior: smooth;
      background: var(--bg-dark);
    }
    .pdf-container {
      padding: 16px;
      max-width: 100%;
    }
    .pdf-page-wrapper {
      position: relative;
      margin-bottom: 24px;
      background: var(--surface-dark);
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
    }
    .pdf-canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    .page-number {
      text-align: center;
      color: #94a3b8;
      font-size: 0.75rem;
      padding: 8px;
      background: rgba(0, 0, 0, 0.2);
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
    }
    /* Location Badges - improved text alignment */
    .text-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }
    .location-badge {
      position: absolute;
      background: linear-gradient(180deg,
          rgba(59, 130, 246, 0.0) 0%,
          rgba(59, 130, 246, 0.0) 40%,
          rgba(59, 130, 246, 0.35) 40%,
          rgba(59, 130, 246, 0.4) 100%);
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.15s ease;
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      border-radius: 2px;
    }
    .location-badge:hover,
    .location-badge.active {
      background: linear-gradient(180deg,
          rgba(59, 130, 246, 0.0) 0%,
          rgba(59, 130, 246, 0.0) 30%,
          rgba(59, 130, 246, 0.5) 30%,
          rgba(59, 130, 246, 0.55) 100%);
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
      z-index: 10;
    }
    /* Region badge - purple marker style with border */
    .location-badge.region-badge {
      background: linear-gradient(180deg,
          rgba(168, 85, 247, 0.0) 0%,
          rgba(168, 85, 247, 0.0) 40%,
          rgba(168, 85, 247, 0.35) 40%,
          rgba(168, 85, 247, 0.45) 100%);
      border: 1px solid rgba(168, 85, 247, 0.4);
    }
    /* Event badge - pink/magenta marker */
    .location-badge.event-badge {
      background: linear-gradient(180deg,
          rgba(236, 72, 153, 0.0) 0%,
          rgba(236, 72, 153, 0.0) 40%,
          rgba(236, 72, 153, 0.35) 40%,
          rgba(236, 72, 153, 0.45) 100%);
    }
    .location-badge.search-highlight {
      background: rgba(251, 191, 36, 0.5) !important;
      border-bottom-color: rgba(251, 191, 36, 1) !important;
    }
    /* Low confidence badge - amber/yellow with question mark */
    .location-badge.low-confidence {
      background: linear-gradient(180deg,
          rgba(251, 191, 36, 0.0) 0%,
          rgba(251, 191, 36, 0.0) 40%,
          rgba(251, 191, 36, 0.35) 40%,
          rgba(251, 191, 36, 0.45) 100%);
      border: 1px dashed rgba(251, 191, 36, 0.6);
      animation: pulse-amber 2s ease-in-out infinite;
    }
    .location-badge.low-confidence:hover {
      background: linear-gradient(180deg,
          rgba(251, 191, 36, 0.0) 0%,
          rgba(251, 191, 36, 0.0) 30%,
          rgba(251, 191, 36, 0.5) 30%,
          rgba(251, 191, 36, 0.6) 100%);
      box-shadow: 0 2px 8px rgba(251, 191, 36, 0.4);
    }
    @keyframes pulse-amber {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.7; }
    }
    /* Tooltip on hover */
    .location-badge::before {
      content: attr(data-location);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(-4px);
      background: rgba(30, 41, 59, 0.95);
      color: white;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 20;
    }
    .location-badge:hover::before {
      opacity: 1;
    }
    /* Placeholder */
    .placeholder {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 60vh;
      color: #64748b;
      text-align: center;
      padding: 32px;
    }
    .placeholder-icon {
      width: 80px;
      height: 80px;
      margin-bottom: 20px;
      opacity: 0.5;
    }
    .placeholder h3 {
      font-size: 1.25rem;
      margin: 0 0 8px;
      color: #94a3b8;
    }
    .placeholder p {
      margin: 0;
      font-size: 0.9rem;
    }
    /* Bottom Navigation */
    .bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: var(--bottom-nav-height);
      background: linear-gradient(to top, var(--bg-dark), var(--surface-dark));
      border-top: 1px solid rgba(255, 255, 255, 0.1);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
      padding-bottom: env(safe-area-inset-bottom);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }
    .bottom-nav.nav-hidden {
      transform: translateY(100%);
    }
    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      padding: 8px 16px;
      border-radius: 16px;
      background: transparent;
      border: none;
      color: #64748b;
      cursor: pointer;
      transition: all 0.3s;
      min-width: 64px;
    }
    .nav-item.active {
      color: var(--primary);
      background: rgba(59, 130, 246, 0.15);
    }
    .nav-item span {
      font-size: 0.65rem;
      font-weight: 500;
    }
    /* Map Panel (Slide Up) */
    .map-panel {
      position: fixed;
      bottom: var(--bottom-nav-height);
      left: 0;
      right: 0;
      height: 50vh;
      background: var(--surface-dark);
      border-radius: 24px 24px 0 0;
      transform: translateY(100%);
      transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 40;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
    }
    .map-panel.open {
      transform: translateY(0);
    }
    .map-handle {
      width: 40px;
      height: 4px;
      background: rgba(255, 255, 255, 0.3);
      border-radius: 2px;
      margin: 12px auto;
    }
    #map {
      width: 100%;
      height: calc(100% - 80px);
      border-radius: 16px 16px 0 0;
    }
    /* Map Controls */
    .map-controls {
      display: flex;
      gap: 6px;
      padding: 4px 8px;
    }
    .map-style-btn {
      padding: 4px 10px;
      border-radius: 6px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: #94a3b8;
      font-size: 0.7rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .map-style-btn.active {
      background: var(--primary);
      color: white;
    }
    /* Layer Toggle Buttons */
    .layer-toggle {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 2px;
      padding: 4px 8px;
      border-radius: 8px;
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: #94a3b8;
      cursor: pointer;
      transition: all 0.2s;
    }
    .layer-toggle:hover {
      background: rgba(255, 255, 255, 0.15);
    }
    .layer-toggle.active {
      background: rgba(59, 130, 246, 0.3);
      border-color: var(--primary);
      color: white;
    }
    /* Timeline Controls */
    .timeline-controls {
      position: fixed;
      bottom: calc(var(--bottom-nav-height) + 16px);
      left: 16px;
      right: 16px;
      background: var(--surface-dark);
      border-radius: 20px;
      padding: 12px 16px;
      display: flex;
      align-items: center;
      gap: 12px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      z-index: 35;
      border: 1px solid rgba(255, 255, 255, 0.1);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1), opacity 0.3s ease;
    }
    .timeline-controls.hidden {
      display: none;
    }
    .timeline-controls.nav-hidden {
      transform: translateY(calc(var(--bottom-nav-height) + 100%));
      opacity: 0;
    }
    .timeline-btn {
      width: 36px;
      height: 36px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }
    .timeline-btn:hover {
      background: var(--primary);
    }
    .timeline-btn.play {
      background: var(--primary);
    }
    #timeline-bar {
      flex: 1;
      height: 6px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 3px;
      cursor: pointer;
      position: relative;
    }
    #timeline-progress {
      position: absolute;
      top: 0;
      left: 0;
      height: 100%;
      background: linear-gradient(90deg, var(--primary), #8b5cf6);
      border-radius: 3px;
      transition: width 0.3s;
    }
    .marker-counter {
      font-size: 0.75rem;
      color: #94a3b8;
      min-width: 50px;
      text-align: center;
    }
    /* Loading Overlay */
    .loading-overlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      z-index: 100;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
    }
    .loading-overlay.show {
      display: flex;
    }
    .spinner {
      width: 50px;
      height: 50px;
      border: 3px solid rgba(255, 255, 255, 0.1);
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }
    .loading-text {
      margin-top: 16px;
      color: #94a3b8;
    }
    /* Search Panel */
    .search-panel {
      position: fixed;
      top: var(--nav-height);
      left: 0;
      right: 0;
      background: var(--surface-dark);
      padding: 12px 16px;
      transform: translateY(-100%);
      transition: transform 0.3s;
      z-index: 45;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    .search-panel.open {
      transform: translateY(0);
    }
    .search-input {
      width: 100%;
      padding: 12px 16px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: white;
      font-size: 1rem;
    }
    .search-input::placeholder {
      color: #64748b;
    }
    .search-input:focus {
      outline: none;
      border-color: var(--primary);
    }
    .search-results {
      display: flex;
      align-items: center;
      gap: 8px;
      margin-top: 8px;
    }
    .search-nav-btn {
      padding: 6px 12px;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      border-radius: 8px;
      color: white;
      cursor: pointer;
    }
    /* Entity Legend */
    .entity-legend {
      display: flex;
      gap: 16px;
      padding: 8px 16px;
      background: rgba(0, 0, 0, 0.2);
      border-radius: 12px;
      margin: 8px 16px;
      font-size: 0.7rem;
    }
    .entity-legend span {
      display: flex;
      align-items: center;
      gap: 6px;
      color: #94a3b8;
    }
    .entity-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
    }
    /* Hidden */
    .hidden {
      display: none !important;
    }
    /* Journey Path Animation */
    .leaflet-journey-path {
      stroke-dasharray: 10, 10;
      animation: dash 30s linear infinite;
    }
    @keyframes dash {
      to {
        stroke-dashoffset: -1000;
      }
    }
    /* More Menu Modal */
    .more-menu {
      position: fixed;
      bottom: var(--bottom-nav-height);
      left: 0;
      right: 0;
      background: var(--surface-dark);
      border-radius: 24px 24px 0 0;
      padding: 20px;
      transform: translateY(100%);
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      z-index: 45;
      box-shadow: 0 -10px 40px rgba(0, 0, 0, 0.5);
    }
    .more-menu.open {
      transform: translateY(0);
    }
    .more-menu h3 {
      margin: 0 0 16px;
      font-size: 1rem;
      color: #94a3b8;
    }
    .menu-item {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      margin: 8px 0;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      color: white;
      cursor: pointer;
      transition: all 0.2s;
      width: 100%;
    }
    .menu-item:hover {
      background: rgba(255, 255, 255, 0.1);
    }
    .menu-item span {
      flex: 1;
      text-align: left;
    }
    .menu-divider {
      height: 1px;
      background: rgba(255, 255, 255, 0.1);
      margin: 16px 0;
    }
    /* Map Controls in Panel */
    .map-controls {
      display: flex;
      gap: 8px;
      padding: 0 16px 12px;
    }
    .map-style-btn {
      flex: 1;
      padding: 8px 12px;
      background: rgba(255, 255, 255, 0.1);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 8px;
      color: #94a3b8;
      font-size: 0.75rem;
      cursor: pointer;
      transition: all 0.2s;
    }
    .map-style-btn.active {
      background: var(--primary);
      color: white;
      border-color: var(--primary);
    }
    /* Split view styles */
    .split-horizontal .main-content {
      display: flex;
      flex-direction: row;
    }
    .split-horizontal #pdf-viewer {
      width: 50%;
      height: calc(100vh - var(--nav-height) - var(--bottom-nav-height));
    }
    .split-horizontal #inline-map-wrapper {
      width: 50%;
      height: calc(100vh - var(--nav-height) - var(--bottom-nav-height));
      display: flex !important;
    }
    .split-horizontal .map-panel {
      display: none !important;
    }
    .split-horizontal .resize-handle {
      width: 8px;
      background: var(--surface-dark);
      cursor: ew-resize;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .split-vertical .main-content {
      display: flex;
      flex-direction: column;
    }
    .split-vertical #pdf-viewer {
      width: 100%;
      height: 50%;
    }
    .split-vertical #inline-map-wrapper {
      width: 100%;
      height: 50%;
      display: flex !important;
    }
    .split-vertical .map-panel {
      display: none !important;
    }
    .split-vertical .resize-handle {
      height: 8px;
      width: 100%;
      background: var(--surface-dark);
      cursor: ns-resize;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .resize-handle {
      display: none;
      color: #64748b;
      font-size: 1rem;
    }
    #inline-map-wrapper {
      display: none;
      background: var(--bg-dark);
    }
    #inline-map {
      width: 100%;
      height: 100%;
      background: var(--bg-dark);
    }
    /* River label tooltips */
    .river-label {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(59, 130, 246, 0.5);
      color: #93c5fd;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    .river-label::before {
      border-top-color: rgba(30, 41, 59, 0.9) !important;
    }
    /* Empire border label tooltips */
    .empire-label {
      background: rgba(30, 41, 59, 0.9);
      border: 1px solid rgba(139, 92, 246, 0.5);
      color: #c4b5fd;
      font-size: 11px;
      font-weight: 500;
      padding: 3px 8px;
      border-radius: 4px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.3);
    }
    /* Toast Notifications */
    .toast-container {
      position: fixed;
      top: calc(var(--nav-height) + 16px);
      left: 50%;
      transform: translateX(-50%);
      z-index: 200;
      display: flex;
      flex-direction: column;
      gap: 8px;
      pointer-events: none;
    }
    .toast {
      background: var(--surface-dark);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 12px;
      padding: 12px 20px;
      color: var(--text-light);
      font-size: 0.9rem;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.4);
      display: flex;
      align-items: center;
      gap: 10px;
      pointer-events: auto;
      animation: toastIn 0.3s ease;
      max-width: 90vw;
    }
    .toast.toast-error {
      border-color: rgba(239, 68, 68, 0.5);
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.15), var(--surface-dark));
    }
    .toast.toast-success {
      border-color: rgba(34, 197, 94, 0.5);
      background: linear-gradient(135deg, rgba(34, 197, 94, 0.15), var(--surface-dark));
    }
    .toast.toast-info {
      border-color: rgba(59, 130, 246, 0.5);
      background: linear-gradient(135deg, rgba(59, 130, 246, 0.15), var(--surface-dark));
    }
    .toast.hiding {
      animation: toastOut 0.3s ease forwards;
    }
    @keyframes toastIn {
      from { opacity: 0; transform: translateY(-20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    @keyframes toastOut {
      from { opacity: 1; transform: translateY(0); }
      to { opacity: 0; transform: translateY(-20px); }
    }
    /* EPUB Styles */
    .epub-container {
      padding: 20px;
      max-width: 800px;
      margin: 0 auto;
    }
    .epub-chapter {
      background: var(--surface-dark);
      border-radius: 16px;
      padding: 24px;
      margin-bottom: 24px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.3);
      color: var(--text-light);
      line-height: 1.8;
      font-size: 1rem;
    }
    .epub-chapter h1, .epub-chapter h2, .epub-chapter h3 {
      color: #e2e8f0;
      margin: 1em 0 0.5em;
    }
    .epub-chapter p {
      margin: 0.8em 0;
    }
    .epub-chapter img {
      max-width: 100%;
      border-radius: 8px;
      margin: 1em 0;
    }
    .epub-chapter-title {
      font-size: 1.25rem;
      font-weight: 600;
      color: var(--primary);
      margin-bottom: 16px;
      padding-bottom: 8px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
    }
    /* EPUB inline location badges */
    .epub-location {
      background: rgba(59, 130, 246, 0.25);
      border-bottom: 2px solid var(--primary);
      padding: 0 2px;
      border-radius: 2px;
      transition: all 0.2s;
    }
    .epub-location:hover,
    .epub-location.active {
      background: rgba(59, 130, 246, 0.4);
    }
    .epub-location.region-badge {
      background: rgba(168, 85, 247, 0.25);
      border-bottom-color: #a855f7;
    }
    .epub-location.event-badge {
      background: rgba(236, 72, 153, 0.25);
      border-bottom-color: #ec4899;
    }
    /* Library Modal */
    .library-modal {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.95);
      z-index: 100;
      display: none;
      overflow-y: auto;
      padding: 20px;
    }
    .library-modal.open {
      display: block;
    }
    .library-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      margin-bottom: 20px;
    }
    .library-header h2 {
      margin: 0;
      font-size: 1.5rem;
    }
    .library-close {
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255, 255, 255, 0.1);
      border: none;
      color: white;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .library-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
      gap: 16px;
    }
    .library-item {
      background: var(--surface-dark);
      border-radius: 12px;
      padding: 16px;
      cursor: pointer;
      transition: all 0.2s;
      border: 1px solid rgba(255, 255, 255, 0.1);
    }
    .library-item:hover {
      transform: translateY(-2px);
      border-color: var(--primary);
    }
    .library-item-icon {
      font-size: 2.5rem;
      text-align: center;
      margin-bottom: 8px;
    }
    .library-item-title {
      font-size: 0.85rem;
      font-weight: 500;
      text-align: center;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }
    .library-item-meta {
      font-size: 0.7rem;
      color: #64748b;
      text-align: center;
      margin-top: 4px;
    }
    .library-item-delete {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 24px;
      height: 24px;
      border-radius: 50%;
      background: rgba(239, 68, 68, 0.8);
      border: none;
      color: white;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      font-size: 14px;
    }
    .library-item {
      position: relative;
    }
    .library-item:hover .library-item-delete {
      display: flex;
    }
    .library-item-unavailable {
      opacity: 0.6;
    }
    .library-item-unavailable .library-item-icon::after {
      content: '⚠️';
      font-size: 0.8rem;
      position: absolute;
      bottom: -4px;
      right: -4px;
    }
    .library-item-icon {
      position: relative;
    }
    .library-empty {
      text-align: center;
      color: #64748b;
      padding: 60px 20px;
    }
    .library-empty-icon {
      font-size: 4rem;
      margin-bottom: 16px;
      opacity: 0.5;
    }
    /* Improved resize handle for mobile */
    .resize-handle {
      touch-action: none;
      user-select: none;
    }
    .split-horizontal .resize-handle {
      min-width: 20px;
      margin: 0 -6px;
    }
    .split-vertical .resize-handle {
      min-height: 20px;
      margin: -6px 0;
    }
  </style>
</head>
<body>
  <div class="toast-container" id="toastContainer"></div>
  <div class="reading-progress" id="readingProgress"></div>
  <!-- Library Modal -->
  <div class="library-modal" id="libraryModal">
    <div class="library-header">
      <h2>Your Library</h2>
      <button class="library-close" id="library-close">✕</button>
    </div>
    <div class="library-grid" id="libraryGrid">
      <!-- Library items will be populated here -->
    </div>
  </div>
  <div class="loading-overlay" id="loadingOverlay">
    <div class="spinner"></div>
    <p class="loading-text" id="loadingText">Loading...</p>
  </div>
  <!-- Header -->
  <header class="app-header">
    <div class="app-logo">
      <span style="font-size: 1.5rem;">🗺️</span>
      <span>ScrollThroughTime</span>
    </div>
    <div class="header-actions">
      <button class="header-btn hide-mobile" id="auto-map-toggle" title="Auto Map" style="background: rgba(20, 184, 166, 0.8);">
        <span style="font-size: 0.65rem; font-weight: 600;">AUTO</span>
      </button>
      <button class="header-btn" id="search-toggle" title="Search">
        <i data-feather="search" style="width:20px;height:20px;"></i>
      </button>
      <button class="header-btn hide-mobile" id="dark-mode-toggle" title="Theme">
        <i data-feather="moon" style="width:20px;height:20px;"></i>
      </button>
    </div>
  </header>
  <!-- Search Panel -->
  <div class="search-panel" id="searchPanel">
    <input type="text" class="search-input" id="search-input" placeholder="Search locations...">
    <div class="search-results">
      <button class="search-nav-btn" id="search-prev">◀</button>
      <span id="search-count" style="color:#94a3b8;font-size:0.8rem;"></span>
      <button class="search-nav-btn" id="search-next">▶</button>
    </div>
  </div>
  <!-- Main Content -->
  <main class="main-content">
    <div id="pdf-viewer">
      <div id="pdf-placeholder" class="placeholder">
        <svg class="placeholder-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5">
          <path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"></path>
          <polyline points="14,2 14,8 20,8"></polyline>
        </svg>
        <h3>No Document Loaded</h3>
        <p>Tap the + button below to upload a PDF</p>
      </div>
      <div id="pdf-container" class="pdf-container hidden"></div>
    </div>
    <div class="resize-handle" id="resizeHandle">⋮</div>
    <div id="inline-map-wrapper" style="display:none;flex-direction:column;">
      <!-- Inline Map Controls -->
      <div id="inline-map-controls"
        style="display:flex;gap:8px;padding:8px;background:var(--surface-dark);flex-wrap:wrap;">
        <button class="map-style-btn active" data-style="modern" data-inline="true">Modern</button>
        <button class="map-style-btn" data-style="topo" data-inline="true">Topo</button>
        <button class="map-style-btn" data-style="satellite" data-inline="true">Satellite</button>
        <span style="border-left:1px solid rgba(255,255,255,0.2);margin:0 4px;"></span>
        <button class="layer-toggle" id="inline-layer-rivers" title="Rivers & Water">
          <span style="font-size:14px;">🌊</span>
          <span style="font-size:10px;">Rivers</span>
        </button>
        <button class="layer-toggle" id="inline-layer-population" title="Narrative Focus Heatmap">
          <span style="font-size:14px;">🔥</span>
          <span style="font-size:10px;">Focus</span>
        </button>
        <button class="layer-toggle" id="inline-layer-terrain" title="Terrain">
          <span style="font-size:14px;">⛰️</span>
          <span style="font-size:10px;">Terrain</span>
        </button>
        <button class="layer-toggle" id="inline-layer-geopolitical" title="Theaters of Conflict">
          <span style="font-size:14px;">⚔️</span>
          <span style="font-size:10px;">Conflict</span>
        </button>
        <button class="layer-toggle" id="inline-layer-borders" title="Historical Borders (c. 1800)">
          <span style="font-size:14px;">🏛️</span>
          <span style="font-size:10px;">Borders</span>
        </button>
      </div>
      <div id="inline-map" style="flex:1;"></div>
    </div>
  </main>
  <!-- Entity Legend -->
  <div class="entity-legend hidden" id="entityLegend">
    <span><span class="entity-dot" style="background:#3b82f6"></span>Location</span>
    <span><span class="entity-dot" style="background:#8b5cf6"></span>Region</span>
    <span><span class="entity-dot" style="background:#ec4899"></span>Event</span>
  </div>
  <!-- Timeline Controls -->
  <div class="timeline-controls hidden" id="timelineControls">
    <button class="timeline-btn" id="prev-marker"><i data-feather="chevron-left"
        style="width:18px;height:18px;"></i></button>
    <div id="timeline-bar">
      <div id="timeline-progress"></div>
    </div>
    <button class="timeline-btn" id="next-marker"><i data-feather="chevron-right"
        style="width:18px;height:18px;"></i></button>
    <button class="timeline-btn play" id="play-journey"><i data-feather="play"
        style="width:18px;height:18px;"></i></button>
    <span class="marker-counter" id="marker-counter">0/0</span>
  </div>
  <!-- Map Panel -->
  <div class="map-panel" id="mapPanel">
    <div class="map-handle"></div>
    <div class="map-controls">
      <button class="map-style-btn active" data-style="modern">Modern</button>
      <button class="map-style-btn" data-style="topo">Topo</button>
      <button class="map-style-btn" data-style="satellite">Satellite</button>
    </div>
    <!-- Historian Overlay Layers -->
    <div class="map-layers" style="display:flex;gap:6px;padding:4px 8px;flex-wrap:wrap;">
      <button class="layer-toggle" id="layer-rivers" title="Rivers & Water">
        <span style="font-size:14px;">🌊</span>
        <span style="font-size:10px;">Rivers</span>
      </button>
      <button class="layer-toggle" id="layer-population" title="Narrative Focus Heatmap">
        <span style="font-size:14px;">🔥</span>
        <span style="font-size:10px;">Focus</span>
      </button>
      <button class="layer-toggle" id="layer-terrain" title="Terrain & Elevation">
        <span style="font-size:14px;">⛰️</span>
        <span style="font-size:10px;">Terrain</span>
      </button>
      <button class="layer-toggle" id="layer-geopolitical" title="Theaters of Conflict">
        <span style="font-size:14px;">⚔️</span>
        <span style="font-size:10px;">Conflict</span>
      </button>
      <button class="layer-toggle" id="layer-borders" title="Historical Borders (c. 1800)">
        <span style="font-size:14px;">🏛️</span>
        <span style="font-size:10px;">Borders</span>
      </button>
    </div>
    <div id="map"></div>
  </div>
  <!-- More Menu -->
  <div class="more-menu" id="moreMenu">
    <h3>Options</h3>
    <button class="menu-item show-mobile-only" id="menu-auto-toggle">
      <i data-feather="zap" style="width:20px;height:20px;"></i>
      <span>Auto Map: <strong id="menu-auto-status">ON</strong></span>
    </button>
    <button class="menu-item show-mobile-only" id="menu-theme-toggle">
      <i data-feather="moon" style="width:20px;height:20px;"></i>
      <span>Toggle Theme</span>
    </button>
    <div class="menu-divider show-mobile-only"></div>
    <button class="menu-item" id="menu-library">
      <i data-feather="book" style="width:20px;height:20px;"></i>
      <span>Document Library</span>
    </button>
    <button class="menu-item" id="menu-test-pdf">
      <i data-feather="file-text" style="width:20px;height:20px;"></i>
      <span>Load Test PDF</span>
    </button>
    <button class="menu-item" id="menu-ocr">
      <i data-feather="camera" style="width:20px;height:20px;"></i>
      <span>OCR Scan Image</span>
    </button>
    <div class="menu-divider"></div>
    <button class="menu-item" id="menu-split-h">
      <i data-feather="columns" style="width:20px;height:20px;"></i>
      <span>Side by Side View</span>
    </button>
    <button class="menu-item" id="menu-split-v">
      <i data-feather="layers" style="width:20px;height:20px;"></i>
      <span>Top/Bottom View</span>
    </button>
    <button class="menu-item" id="menu-panel-mode">
      <i data-feather="maximize-2" style="width:20px;height:20px;"></i>
      <span>Full Screen + Map Panel</span>
    </button>
    <div class="menu-divider"></div>
    <button class="menu-item" id="menu-export">
      <i data-feather="download" style="width:20px;height:20px;"></i>
      <span>Export Annotations</span>
    </button>
    <div class="menu-divider" id="install-divider" style="display:none;"></div>
    <button class="menu-item" id="menu-install" style="display:none; color: var(--primary);">
      <i data-feather="download-cloud" style="width:20px;height:20px;"></i>
      <span>Install App</span>
    </button>
  </div>
  <!-- Export Modal -->
  <div class="more-menu" id="exportModal" style="max-height: 40vh;">
    <h3>Export Annotations</h3>
    <button class="menu-item" id="export-geojson">
      <i data-feather="map-pin" style="width:20px;height:20px;"></i>
      <span>Export as GeoJSON</span>
    </button>
    <button class="menu-item" id="export-kml">
      <i data-feather="globe" style="width:20px;height:20px;"></i>
      <span>Export as KML</span>
    </button>
    <button class="menu-item" id="export-csv">
      <i data-feather="file-text" style="width:20px;height:20px;"></i>
      <span>Export as CSV</span>
    </button>
    <div class="menu-divider"></div>
    <button class="menu-item" id="close-export-modal" style="justify-content: center;">
      <span>Cancel</span>
    </button>
  </div>
  <!-- Bottom Navigation -->
  <nav class="bottom-nav">
    <button class="nav-item active" id="nav-home" data-view="home">
      <i data-feather="book-open" style="width:22px;height:22px;"></i>
      <span>Read</span>
    </button>
    <button class="nav-item" id="nav-upload">
      <i data-feather="plus-circle" style="width:26px;height:26px;"></i>
      <span>Upload</span>
    </button>
    <button class="nav-item" id="nav-map" data-view="map">
      <i data-feather="map" style="width:22px;height:22px;"></i>
      <span>Map</span>
    </button>
    <button class="nav-item" id="nav-more">
      <i data-feather="more-horizontal" style="width:22px;height:22px;"></i>
      <span>More</span>
    </button>
  </nav>
  <!-- Hidden Inputs -->
  <input type="file" id="pdf-input" accept=".pdf,.epub,image/*" class="hidden">
  <input type="file" id="ocr-input" accept="image/*" class="hidden">
  <script src="app.js"></script>
</body>
</html>
