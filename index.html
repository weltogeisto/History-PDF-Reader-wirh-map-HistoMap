<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ScrollThroughTime - Historical Map Reader</title>

  <!-- Tailwind -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Feather Icons -->
  <script src="https://unpkg.com/feather-icons"></script>

  <!-- Leaflet -->
  <link
    rel="stylesheet"
    href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.3/leaflet.css"
  />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.3/leaflet.js"></script>

  <!-- jsPDF (for test PDF) -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

  <!-- PDF.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>

  <style>
    * {
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
      overscroll-behavior: none;
    }

    .reading-progress {
      position: fixed;
      top: 0;
      left: 0;
      height: 3px;
      background: linear-gradient(90deg, #3b82f6, #8b5cf6);
      z-index: 100;
      width: 0;
      transition: width 0.2s;
    }

    #pdf-viewer {
      overflow-y: auto;
      background: #f9fafb;
    }
    #map-container {
      background: #e5e7eb;
    }
    #map {
      width: 100%;
      height: 100%;
    }

    .pdf-container {
      max-width: 100%;
      padding: 20px;
    }
    .pdf-page-wrapper {
      position: relative;
      margin-bottom: 40px;
      background: white;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      border-radius: 4px;
      overflow: hidden;
    }
    .pdf-canvas {
      display: block;
      width: 100%;
      height: auto;
    }
    .page-number {
      text-align: center;
      color: #9ca3af;
      font-size: 0.875rem;
      padding: 10px;
      background: #f9fafb;
      border-bottom: 1px solid #e5e7eb;
    }

    .text-overlay {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 5;
    }

    /* Fixed: Simple highlight without duplicate label */
    .location-badge {
      position: absolute;
      background: rgba(59, 130, 246, 0.25);
      border-bottom: 2px solid rgba(59, 130, 246, 0.8);
      border-radius: 2px;
      cursor: pointer;
      pointer-events: auto;
      transition: all 0.2s ease;
    }
    .location-badge:hover {
      background: rgba(59, 130, 246, 0.4);
      box-shadow: 0 2px 8px rgba(59, 130, 246, 0.4);
      z-index: 10;
    }
    .location-badge.active {
      background: rgba(239, 68, 68, 0.35);
      border-bottom-color: rgba(239, 68, 68, 0.9);
      box-shadow: 0 2px 10px rgba(239, 68, 68, 0.5);
      z-index: 15;
    }
    
    /* Region badge styling (for Anatolia, Balkans, etc.) */
    .location-badge.region-badge {
      background: rgba(139, 92, 246, 0.25);
      border-bottom-color: rgba(139, 92, 246, 0.8);
    }
    .location-badge.region-badge:hover {
      background: rgba(139, 92, 246, 0.4);
      box-shadow: 0 2px 8px rgba(139, 92, 246, 0.4);
    }
    .location-badge.region-badge.active {
      background: rgba(139, 92, 246, 0.5);
      border-bottom-color: rgba(139, 92, 246, 1);
      box-shadow: 0 2px 10px rgba(139, 92, 246, 0.6);
    }

    /* Tooltip on hover */
    .location-badge::before {
      content: attr(data-location);
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%) translateY(-4px);
      background: rgba(30, 41, 59, 0.95);
      color: white;
      padding: 4px 8px;
      font-size: 11px;
      border-radius: 4px;
      white-space: nowrap;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
      z-index: 20;
    }
    .location-badge:hover::before {
      opacity: 1;
    }

    .resize-handle {
      display: none;
      background: linear-gradient(to right, #e5e7eb 0%, #9ca3af 50%, #e5e7eb 100%);
      cursor: ew-resize;
      z-index: 20;
      touch-action: none;
    }
    .resize-handle::before {
      content: "⋮⋮";
      color: white;
      font-size: 0.75rem;
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
    }

    @media (min-width: 769px) {
      #pdf-viewer,
      #map-container {
        height: calc(100vh - 4rem);
      }
      .resize-handle {
        display: block;
        width: 10px;
        height: 100%;
        position: relative;
      }
    }

    @media (max-width: 768px) {
      nav {
        position: relative !important;
      }
      .nav-controls {
        flex-wrap: wrap;
        gap: 0.5rem;
      }
      .nav-controls button {
        font-size: 0.75rem !important;
        padding: 0.5rem !important;
      }
      .main-content {
        flex-direction: column !important;
        padding-top: 0 !important;
      }
      #pdf-viewer,
      #map-container {
        width: 100% !important;
        height: 50vh !important;
        position: relative !important;
      }
      .resize-handle {
        display: block;
        width: 100%;
        height: 10px;
        background: linear-gradient(to bottom, #e5e7eb 0%, #9ca3af 50%, #e5e7eb 100%);
        cursor: ns-resize;
        position: relative;
      }
      .resize-handle::before {
        content: "⋯⋯";
      }
    }

    .timeline-controls {
      width: 90%;
      padding: 0.5rem;
    }
  </style>
</head>
<body class="bg-gray-100">
  <div class="reading-progress" id="readingProgress"></div>

  <nav class="bg-white shadow-md fixed w-full z-10">
    <div class="max-w-7xl mx-auto px-2 sm:px-4 lg:px-6">
      <div class="flex justify-between h-auto md:h-16 py-2 md:py-0">
        <div class="flex items-center">
          <i data-feather="map" class="text-red-600 mr-2 w-5 h-5"></i>
          <span class="text-lg md:text-xl font-bold text-gray-800">ScrollThroughTime</span>
        </div>
        <div class="flex items-center flex-wrap gap-2 nav-controls">
          <button id="upload-btn" class="px-3 py-2 bg-blue-600 text-white rounded-md hover:bg-blue-700 transition flex items-center text-sm">
            <i data-feather="upload" class="mr-1 w-4 h-4"></i>Upload
          </button>
          <button id="generate-test-pdf" class="px-3 py-2 bg-green-500 text-white rounded-md hover:bg-green-600 transition flex items-center text-sm">
            <i data-feather="file-text" class="mr-1 w-4 h-4"></i>Test
          </button>
          <button id="auto-map-toggle" class="px-3 py-2 bg-teal-500 text-white rounded-md hover:bg-teal-600 transition text-sm">Auto ON</button>
          <input type="file" id="pdf-input" accept=".pdf" class="hidden" />
        </div>
      </div>
    </div>
  </nav>

  <div class="pt-0 md:pt-16 pb-8 flex flex-col md:flex-row main-content">
    <div id="pdf-viewer" class="w-full md:w-1/2 h-screen overflow-y-auto bg-gray-50">
      <div id="pdf-placeholder" class="text-center py-20 text-gray-500">
        <i data-feather="file" class="w-12 h-12 mx-auto mb-4"></i>
        <h3 class="text-xl font-medium">No PDF Loaded</h3>
        <p class="mt-2">Upload a PDF or click Test to begin</p>
      </div>
      <div id="pdf-container" class="pdf-container hidden"></div>
    </div>

    <div id="resizeHandle" class="resize-handle"></div>

    <div id="map-container" class="w-full md:w-1/2 h-screen sticky top-16">
      <div id="map"></div>
    </div>
  </div>

  <div class="fixed bottom-4 left-1/2 transform -translate-x-1/2 bg-white p-3 rounded-lg shadow-xl flex items-center space-x-4 z-10 timeline-controls">
    <button id="prev-marker" class="p-2 rounded-full bg-gray-200 hover:bg-gray-300 transition">
      <i data-feather="chevron-left" class="w-4 h-4"></i>
    </button>
    <div id="timeline-bar" class="w-32 md:w-64 h-2 bg-gray-200 rounded-full relative cursor-pointer">
      <div id="timeline-progress" class="absolute top-0 left-0 h-full bg-blue-600 rounded-full transition-all duration-300" style="width: 0"></div>
    </div>
    <button id="next-marker" class="p-2 rounded-full bg-gray-200 hover:bg-gray-300 transition">
      <i data-feather="chevron-right" class="w-4 h-4"></i>
    </button>
    <span class="text-sm font-medium"><span id="marker-counter">0/0</span></span>
  </div>

  <script>
    if (typeof window.pdfjsLib !== "undefined") {
      window.pdfjsLib.GlobalWorkerOptions.workerSrc =
        "https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js";
    }

    const state = {
      pdfDoc: null,
      map: null,
      regionPolygons: [],
      autoMap: true,
      allLocations: [],
      currentLocationIndex: 0,
      isResizing: false,
      activeMapMarker: null,
      activeRegionPolygon: null,
    };

    // Combined geo database with points AND regions
    const geoDatabase = {
      // Cities/Points
      Constantinople: { coords: [41.0082, 28.9784], type: "point" },
      Istanbul: { coords: [41.0082, 28.9784], type: "point" },
      Moscow: { coords: [55.7558, 37.6173], type: "point" },
      Sevastopol: { coords: [44.6167, 33.525], type: "point" },
      Kiev: { coords: [50.4501, 30.5234], type: "point" },
      Vienna: { coords: [48.2082, 16.3738], type: "point" },
      Athens: { coords: [37.9838, 23.7275], type: "point" },
      Varna: { coords: [43.2141, 27.9147], type: "point" },
      Sofia: { coords: [42.6977, 23.3219], type: "point" },
      Belgrade: { coords: [44.7866, 20.4489], type: "point" },
      Bucharest: { coords: [44.4268, 26.1025], type: "point" },
      Odessa: { coords: [46.4825, 30.7233], type: "point" },
      Erzurum: { coords: [39.9, 41.2667], type: "point" },
      Cairo: { coords: [30.0444, 31.2357], type: "point" },
      Baghdad: { coords: [33.3152, 44.3661], type: "point" },
      Damascus: { coords: [33.5138, 36.2765], type: "point" },
      Mohacs: { coords: [45.9928, 18.6839], type: "point" },
      Azov: { coords: [47.1, 39.4], type: "point" },
      
      // Regions (polygon)
      Anatolia: {
        type: "region",
        coords: [[36.0, 26.0], [41.5, 26.0], [42.0, 40.0], [37.0, 44.5], [36.0, 26.0]],
        center: [39.0, 35.0],
        color: "#3b82f6"
      },
      Balkans: {
        type: "region",
        coords: [[37.0, 19.0], [46.0, 13.0], [47.0, 22.0], [40.0, 28.0], [37.0, 21.0]],
        center: [42.0, 21.0],
        color: "#8b5cf6"
      },
      Caucasus: {
        type: "region",
        coords: [[40.0, 38.0], [44.0, 48.0], [40.0, 48.0], [40.0, 38.0]],
        center: [42.0, 43.0],
        color: "#10b981"
      },
      Crimea: {
        type: "region",
        coords: [[44.4, 32.5], [45.5, 32.5], [46.2, 34.0], [45.5, 36.5], [44.4, 35.5], [44.4, 32.5]],
        center: [45.0, 34.0],
        color: "#f59e0b"
      },
      Hungary: {
        type: "region",
        coords: [[45.8, 16.0], [48.5, 16.5], [48.5, 22.5], [46.0, 22.5], [45.8, 16.0]],
        center: [47.1625, 19.5033],
        color: "#ef4444"
      },
      Austria: {
        type: "region",
        coords: [[46.4, 9.5], [49.0, 9.5], [49.0, 17.2], [46.4, 17.2], [46.4, 9.5]],
        center: [47.5162, 14.5501],
        color: "#ec4899"
      },
      
      // Rivers/Seas (lines or approximate points)
      Danube: { coords: [45.0, 29.0], type: "point" },
      Volga: { coords: [55.0, 49.0], type: "point" },
      "Black Sea": { coords: [43.0, 35.0], type: "point" },
      
      // Other
      German: { coords: [51.1657, 10.4515], type: "point" },
      Germany: { coords: [51.1657, 10.4515], type: "point" },
      Habsburg: { coords: [48.2082, 16.3738], type: "point" },
    };

    function initMap() {
      state.map = L.map("map").setView([45, 25], 5);
      L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
        maxZoom: 18,
        attribution: "© OpenStreetMap",
      }).addTo(state.map);

      // Pre-create region polygons (hidden initially)
      Object.keys(geoDatabase).forEach((name) => {
        const entry = geoDatabase[name];
        if (entry.type === "region") {
          const polygon = L.polygon(entry.coords, {
            color: entry.color,
            fillColor: entry.color,
            fillOpacity: 0,
            weight: 2,
            opacity: 0,
          }).addTo(state.map);
          polygon.bindPopup("<b>" + name + "</b>");
          polygon.regionName = name;
          state.regionPolygons.push(polygon);
        }
      });
    }

    function handleLocationClick(locationName, element) {
      const entry = geoDatabase[locationName];
      if (!entry) return;

      // Update active badge
      document.querySelectorAll(".location-badge").forEach((el) => el.classList.remove("active"));
      element.classList.add("active");

      // Update current index for timeline
      const idx = state.allLocations.findIndex(
        (loc) => loc.name === locationName && loc.element === element
      );
      if (idx !== -1) {
        state.currentLocationIndex = idx;
        updateTimeline();
      }

      if (!state.autoMap || !state.map) return;

      // Clear existing highlights
      if (state.activeMapMarker) {
        state.map.removeLayer(state.activeMapMarker);
        state.activeMapMarker = null;
      }
      state.regionPolygons.forEach((p) =>
        p.setStyle({ fillOpacity: 0, opacity: 0, weight: 2 })
      );
      state.activeRegionPolygon = null;

      // Handle region vs point
      if (entry.type === "region") {
        const poly = state.regionPolygons.find((p) => p.regionName === locationName);
        if (poly) {
          poly.setStyle({ fillOpacity: 0.35, opacity: 0.9, weight: 3 });
          state.activeRegionPolygon = poly;
          state.map.fitBounds(poly.getBounds(), { padding: [30, 30] });
          poly.openPopup();
        }
      } else {
        const coords = entry.coords;
        state.map.setView(coords, 8);
        const marker = L.circleMarker(coords, {
          radius: 15,
          fillColor: "#ef4444",
          color: "#ffffff",
          weight: 3,
          fillOpacity: 0.7,
        })
          .addTo(state.map)
          .bindPopup("<b>" + locationName + "</b>")
          .openPopup();
        state.activeMapMarker = marker;
      }
    }

    async function renderAllPages() {
      const container = document.getElementById("pdf-container");
      container.innerHTML = "";
      state.allLocations = [];

      for (let pageNum = 1; pageNum <= state.pdfDoc.numPages; pageNum++) {
        const page = await state.pdfDoc.getPage(pageNum);
        const scale = 1.5;
        const viewport = page.getViewport({ scale });

        const pageWrapper = document.createElement("div");
        pageWrapper.className = "pdf-page-wrapper";
        pageWrapper.dataset.page = pageNum;

        const pageNumber = document.createElement("div");
        pageNumber.className = "page-number";
        pageNumber.textContent = "Page " + pageNum;
        pageWrapper.appendChild(pageNumber);

        const canvasContainer = document.createElement("div");
        canvasContainer.style.position = "relative";
        canvasContainer.style.width = "100%";

        const canvas = document.createElement("canvas");
        const ctx = canvas.getContext("2d");
        canvas.width = viewport.width;
        canvas.height = viewport.height;
        canvas.className = "pdf-canvas";

        await page.render({ canvasContext: ctx, viewport }).promise;
        canvasContainer.appendChild(canvas);

        const textOverlay = document.createElement("div");
        textOverlay.className = "text-overlay";

        const displayScale = canvas.clientWidth / viewport.width || 1;
        const displayHeight = viewport.height * displayScale;
        canvasContainer.style.height = displayHeight + "px";
        textOverlay.style.width = canvas.clientWidth + "px";
        textOverlay.style.height = displayHeight + "px";
        textOverlay.dataset.viewportWidth = viewport.width;
        textOverlay.dataset.viewportHeight = viewport.height;

        const textContent = await page.getTextContent();

        textContent.items.forEach((item) => {
          const rawText = (item.str || "").trim();
          if (!rawText) return;

          const rawTransform = item.transform || [];
          const transform = pdfjsLib.Util.transform(viewport.transform, rawTransform);
          const fontHeight = Math.hypot(transform[1] || 0, transform[3] || 0);
          const textWidthPx = (item.width || 0) * viewport.scale;
          const leftBase = transform[4] || 0;
          const topBase = (transform[5] || 0) - fontHeight;

          Object.keys(geoDatabase).forEach((location) => {
            const regex = new RegExp(`\\b${location}\\b`, "gi");
            const matches = rawText.matchAll(regex);

            Array.from(matches).forEach((match) => {
              const startIndex = match.index || 0;
              const wordLength = match[0].length;
              const textLength = rawText.length || 1;

              const startFraction = startIndex / textLength;
              const widthFraction = wordLength / textLength;

              const highlightWidthBase = textWidthPx * widthFraction;
              const leftOffsetBase = leftBase + textWidthPx * startFraction;
              const highlightHeightBase = fontHeight || 14;
              const topOffsetBase = topBase;

              const highlight = document.createElement("div");
              highlight.className = "location-badge";
              
              // Add region-badge class for regions
              const entry = geoDatabase[location];
              if (entry && entry.type === "region") {
                highlight.classList.add("region-badge");
              }
              
              highlight.dataset.location = location;
              highlight.dataset.left = leftOffsetBase;
              highlight.dataset.top = topOffsetBase;
              highlight.dataset.width = highlightWidthBase;
              highlight.dataset.height = highlightHeightBase;

              highlight.style.left = leftOffsetBase * displayScale + "px";
              highlight.style.top = topOffsetBase * displayScale + "px";
              highlight.style.width = highlightWidthBase * displayScale + "px";
              highlight.style.height = highlightHeightBase * displayScale + "px";
              highlight.title = location + " - Click to view on map";

              highlight.onclick = () => handleLocationClick(location, highlight);

              textOverlay.appendChild(highlight);

              state.allLocations.push({
                name: location,
                element: highlight,
                page: pageNum,
              });
            });
          });
        });

        canvasContainer.appendChild(textOverlay);
        pageWrapper.appendChild(canvasContainer);
        container.appendChild(pageWrapper);
      }

      updateTimeline();
      rescaleOverlays();
    }

    function updateTimeline() {
      const total = state.allLocations.length;
      const counter = document.getElementById("marker-counter");
      counter.textContent = (total === 0 ? 0 : state.currentLocationIndex + 1) + "/" + total;

      if (total === 0) {
        document.getElementById("timeline-progress").style.width = "0";
        return;
      }

      const progress = (state.currentLocationIndex / Math.max(total - 1, 1)) * 100;
      document.getElementById("timeline-progress").style.width = progress + "%";
    }

    function rescaleOverlays() {
      document.querySelectorAll(".pdf-page-wrapper").forEach((wrapper) => {
        const canvas = wrapper.querySelector("canvas");
        const overlay = wrapper.querySelector(".text-overlay");
        const canvasContainer = canvas?.parentElement;

        if (!canvas || !overlay || !canvasContainer) return;

        const viewportWidth = Number(overlay.dataset.viewportWidth) || 1;
        const viewportHeight = Number(overlay.dataset.viewportHeight) || 1;
        const displayScale = canvas.clientWidth / viewportWidth;
        const displayHeight = viewportHeight * displayScale;

        overlay.style.width = canvas.clientWidth + "px";
        overlay.style.height = displayHeight + "px";
        canvasContainer.style.height = displayHeight + "px";

        overlay.querySelectorAll(".location-badge").forEach((badge) => {
          const left = Number(badge.dataset.left) || 0;
          const top = Number(badge.dataset.top) || 0;
          const width = Number(badge.dataset.width) || 0;
          const height = Number(badge.dataset.height) || 0;

          badge.style.left = left * displayScale + "px";
          badge.style.top = top * displayScale + "px";
          badge.style.width = width * displayScale + "px";
          badge.style.height = height * displayScale + "px";
        });
      });
    }

    function navigateToLocation(index) {
      if (index < 0 || index >= state.allLocations.length) return;
      state.currentLocationIndex = index;
      const location = state.allLocations[index];

      location.element.scrollIntoView({ behavior: "smooth", block: "center" });
      handleLocationClick(location.name, location.element);
    }

    function updateReadingProgress() {
      const viewer = document.getElementById("pdf-viewer");
      if (!viewer) return;
      const scrollPercent = (viewer.scrollTop / (viewer.scrollHeight - viewer.clientHeight || 1)) * 100;
      document.getElementById("readingProgress").style.width = Math.min(scrollPercent, 100) + "%";
    }

    async function loadPDF(fileOrBlob) {
      try {
        if (typeof window.pdfjsLib === "undefined") {
          throw new Error("PDF.js library not loaded");
        }

        const arrayBuffer = await fileOrBlob.arrayBuffer();
        const loadingTask = window.pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) });
        state.pdfDoc = await loadingTask.promise;

        document.getElementById("pdf-placeholder").classList.add("hidden");
        document.getElementById("pdf-container").classList.remove("hidden");

        await renderAllPages();
      } catch (error) {
        alert("Error loading PDF: " + error.message);
        console.error("PDF Error", error);
      }
    }

    function generateTestPDF() {
      if (!window.jspdf) {
        alert("jsPDF library not loaded");
        return;
      }
      const { jsPDF } = window.jspdf;
      const doc = new jsPDF();

      doc.setFontSize(16);
      doc.text("The Battle of Mohacs 1526", 20, 20);
      doc.setFontSize(12);
      doc.text("Near Hungary, Ottoman forces defeated Habsburg.", 20, 40);
      doc.text("The march continued toward Vienna and the Danube.", 20, 50);
      doc.text("German resistance formed as Constantinople directed.", 20, 60);
      doc.text("The Anatolia region supplied troops.", 20, 70);

      doc.addPage();
      doc.setFontSize(16);
      doc.text("Ottoman Expansion", 20, 20);
      doc.setFontSize(12);
      doc.text("Key cities: Constantinople, Moscow, Cairo, Baghdad.", 20, 40);
      doc.text("Regions: Anatolia, Balkans, and Caucasus.", 20, 50);
      doc.text("Strategic areas: Black Sea and Crimea.", 20, 60);

      doc.addPage();
      doc.setFontSize(16);
      doc.text("Later Campaigns", 20, 20);
      doc.setFontSize(12);
      doc.text("Extended to Damascus and Baghdad in the east.", 20, 40);
      doc.text("Cities: Belgrade, Bucharest, Odessa, Sevastopol.", 20, 50);
      doc.text("Struggle for Austria and Vienna continued.", 20, 60);

      loadPDF(doc.output("blob"));
    }

    function initResizer() {
      const handle = document.getElementById("resizeHandle");
      const pdfViewer = document.getElementById("pdf-viewer");
      const mapContainer = document.getElementById("map-container");

      let startY = 0, startX = 0, startHeightPdf = 0, startWidthPdf = 0;

      function startResize(e) {
        state.isResizing = true;
        const isTouch = e.type === "touchstart";
        startY = isTouch ? e.touches[0].clientY : e.clientY;
        startX = isTouch ? e.touches[0].clientX : e.clientX;
        startHeightPdf = pdfViewer.offsetHeight;
        startWidthPdf = pdfViewer.offsetWidth;

        document.addEventListener("mousemove", resize);
        document.addEventListener("touchmove", resize);
        document.addEventListener("mouseup", stopResize);
        document.addEventListener("touchend", stopResize);
        e.preventDefault();
      }

      function resize(e) {
        if (!state.isResizing) return;
        const isTouch = e.type === "touchmove";

        if (window.innerWidth <= 768) {
          const currentY = isTouch ? e.touches[0].clientY : e.clientY;
          const newHeight = startHeightPdf + (currentY - startY);
          const clamped = Math.max(window.innerHeight * 0.2, Math.min(window.innerHeight * 0.8, newHeight));
          pdfViewer.style.height = clamped + "px";
          mapContainer.style.height = window.innerHeight - clamped - 10 + "px";
        } else {
          const currentX = isTouch ? e.touches[0].clientX : e.clientX;
          const newWidth = startWidthPdf + (currentX - startX);
          const clamped = Math.max(window.innerWidth * 0.2, Math.min(window.innerWidth * 0.8, newWidth));
          pdfViewer.style.width = clamped + "px";
          mapContainer.style.width = window.innerWidth - clamped - 10 + "px";
          if (state.map) state.map.invalidateSize();
          rescaleOverlays();
        }
      }

      function stopResize() {
        state.isResizing = false;
        document.removeEventListener("mousemove", resize);
        document.removeEventListener("touchmove", resize);
        document.removeEventListener("mouseup", stopResize);
        document.removeEventListener("touchend", stopResize);
      }

      handle.addEventListener("mousedown", startResize);
      handle.addEventListener("touchstart", startResize, { passive: false });
    }

    // Event listeners
    document.getElementById("upload-btn").addEventListener("click", () => document.getElementById("pdf-input").click());
    document.getElementById("pdf-input").addEventListener("change", (e) => {
      const file = e.target.files && e.target.files[0];
      if (file) loadPDF(file);
    });
    document.getElementById("generate-test-pdf").addEventListener("click", generateTestPDF);
    document.getElementById("auto-map-toggle").addEventListener("click", (e) => {
      state.autoMap = !state.autoMap;
      e.target.textContent = "Auto " + (state.autoMap ? "ON" : "OFF");
      e.target.classList.toggle("bg-teal-500", state.autoMap);
      e.target.classList.toggle("bg-gray-400", !state.autoMap);
    });
    document.getElementById("prev-marker").addEventListener("click", () => {
      if (state.currentLocationIndex > 0) navigateToLocation(state.currentLocationIndex - 1);
    });
    document.getElementById("next-marker").addEventListener("click", () => {
      if (state.currentLocationIndex < state.allLocations.length - 1) navigateToLocation(state.currentLocationIndex + 1);
    });
    document.getElementById("timeline-bar").addEventListener("click", (e) => {
      if (!state.allLocations.length) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const percent = (e.clientX - rect.left) / rect.width;
      const targetIndex = Math.floor(percent * state.allLocations.length);
      navigateToLocation(Math.min(targetIndex, state.allLocations.length - 1));
    });
    document.getElementById("pdf-viewer").addEventListener("scroll", updateReadingProgress);
    window.addEventListener("resize", rescaleOverlays);

    // Init
    initMap();
    initResizer();
    feather.replace();
  </script>
</body>
</html>
