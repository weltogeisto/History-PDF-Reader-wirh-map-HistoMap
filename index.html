    .dark .text-gray-800 { color: #f3f4f6 !important; }
    .dark .text-gray-500 { color: #9ca3af !important; }
    .dark .pdf-page-wrapper { background: #1f2937 !important; }
    .dark .page-number { background: #374151 !important; border-color: #4b5563 !important; color: #d1d5db !important; }
    .dark .timeline-controls { background: #1f2937 !important; }
    .dark .bg-gray-200 { background: #374151 !important; }
    .dark input, .dark select { background: #374151 !important; color: #f3f4f6 !important; border-color: #4b5563 !important; }
    .dark .modal-content { background: #1f2937; }

    #pdf-viewer { overflow-y: auto; background: #f9fafb; scroll-behavior: smooth; }
    #map-container { background: #e5e7eb; }
    #map { width: 100%; height: 100%; }

    .pdf-container { max-width: 100%; padding: 20px; }
    .pdf-page-wrapper { position: relative; margin-bottom: 40px; background: white; box-shadow: 0 2px 8px rgba(0,0,0,0.1); border-radius: 8px; overflow: hidden; }
    .pdf-canvas { display: block; width: 100%; height: auto; }
    .page-number { text-align: center; color: #6b7280; font-size: 0.875rem; padding: 10px; background: #f9fafb; border-bottom: 1px solid #e5e7eb; }

    .text-overlay { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }

    .location-badge { position: absolute; background: rgba(59,130,246,0.25); border-bottom: 2px solid rgba(59,130,246,0.8); border-radius: 2px; cursor: pointer; pointer-events: auto; transition: all 0.2s ease; }
    .location-badge:hover { background: rgba(59,130,246,0.4); box-shadow: 0 2px 8px rgba(59,130,246,0.4); z-index: 10; }
    .location-badge.active { background: rgba(239,68,68,0.35); border-bottom-color: rgba(239,68,68,0.9); box-shadow: 0 2px 10px rgba(239,68,68,0.5); z-index: 15; }
    .location-badge.region-badge { background: rgba(139,92,246,0.25); border-bottom-color: rgba(139,92,246,0.8); }
    .location-badge.event-badge { background: rgba(236,72,153,0.25); border-bottom-color: rgba(236,72,153,0.8); }

    .location-badge::before { content: attr(data-location); position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%) translateY(-4px); background: rgba(30,41,59,0.95); color: white; padding: 4px 8px; font-size: 11px; border-radius: 4px; white-space: nowrap; opacity: 0; pointer-events: none; transition: opacity 0.2s; z-index: 20; }
    .location-badge:hover::before { opacity: 1; }

    .resize-handle { display: none; background: linear-gradient(to right, #e5e7eb 0%, #6b7280 50%, #e5e7eb 100%); cursor: ew-resize; z-index: 20; touch-action: none; }
    .resize-handle::before { content: "⋮⋮"; color: white; font-size: 0.75rem; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); }

    @media (min-width: 769px) {
      #pdf-viewer, #map-container { height: calc(100vh - 4rem); }
      .resize-handle { display: block; width: 10px; height: 100%; position: relative; }
    }
    @media (max-width: 768px) {
      nav { position: relative !important; }
      .nav-controls { flex-wrap: wrap; gap: 0.5rem; }
      .nav-controls button, .nav-controls select { font-size: 0.7rem !important; padding: 0.4rem 0.6rem !important; }

<body class="bg-gray-100">
  <div class="reading-progress" id="readingProgress"></div>

          <input type="file" id="ocr-input" accept="image/*" class="hidden" />

        <div class="relative flex-1">

      <div class="entity-legend border-t border-gray-200">

        <span><span class="entity-dot" style="background:#8b5cf6"></span>Region</span>

// Haversine distance for context-aware resolution
function haversine(lat1, lon1, lat2, lon2) {
  const R = 6371;
  const dLat = (lat2 - lat1) * Math.PI / 180;
  const dLon = (lon2 - lon1) * Math.PI / 180;
  const a = Math.sin(dLat/2) * Math.sin(dLat/2) +
            Math.cos(lat1 * Math.PI / 180) * Math.cos(lat2 * Math.PI / 180) *
            Math.sin(dLon/2) * Math.sin(dLon/2);
  return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
}

// NEW: Context-aware coordinate resolver
function getContextualCoords(name) {
  // Check event locations first
  if (eventLocations[name]) return eventLocations[name];

  const eventMatch = name.match(/(?:Battle|Siege|Fall|Treaty|War) of (\w+)/i);
  if (eventMatch && eventLocations[eventMatch[1]]) return eventLocations[eventMatch[1]];

  const entry = geoDatabase[name];
  if (!entry) return null;

  // For rivers with segments, choose closest to recent context
  if (entry.type === "river" && entry.segments) {
    if (state.recentContext.length === 0) {
      return entry.segments.middle.coords; // Default to middle
    }

    const lastCoord = state.recentContext[state.recentContext.length - 1].coords;
    let closestSegment = null;
    let minDist = Infinity;

    Object.values(entry.segments).forEach(seg => {
      const dist = haversine(lastCoord[0], lastCoord[1], seg.coords[0], seg.coords[1]);
      if (dist < minDist) {
        minDist = dist;
        closestSegment = seg.coords;
      }
    });

    return closestSegment;
  }

  // For regions, use center
  if (entry.type === "region" && entry.center) return entry.center;

  // For regular locations
  if (entry.coords && Array.isArray(entry.coords) && entry.coords.length === 2 && typeof entry.coords[0] === "number") {
    return entry.coords;
  }

  return null;
}

// Add to context tracker
function addToContext(name, coords, page) {
  if (!coords) return;
  state.recentContext.push({ name, coords, page });
  if (state.recentContext.length > 5) state.recentContext.shift();
}

function extractEntitiesForPage(fullPageText) {
  const entities = [];
  const foundOnPage = new Set();

  Object.keys(geoDatabase).forEach(location => {
    if (foundOnPage.has(location.toLowerCase())) return;

    const entry = geoDatabase[location];
    if (entry.type === "river") return; // Rivers handled separately with context

    const terms = [location, ...(entry.aliases || [])];

    for (const term of terms) {
      const regex = new RegExp("\\b" + term + "\\b", "gi");
      const match = regex.exec(fullPageText);
      if (match && !foundOnPage.has(location.toLowerCase())) {
        foundOnPage.add(location.toLowerCase());
        entities.push({
          text: match[0],
          type: entry.type === "region" ? "region" : "location",
          name: location,
          index: match.index,
          length: match[0].length,
          searchTerm: term
        });
        break;
      }
    }
  });

  // Events
  const eventPatterns = [
    { pattern: /Battle of ([A-Z][a-z]+)/gi, prefix: "Battle of " },
    { pattern: /Siege of ([A-Z][a-z]+)/gi, prefix: "Siege of " },
    { pattern: /Fall of ([A-Z][a-z]+)/gi, prefix: "Fall of " },
    { pattern: /Treaty of ([A-Z][a-z]+)/gi, prefix: "Treaty of " }
  ];

  eventPatterns.forEach(({ pattern }) => {
    let m;
    while ((m = pattern.exec(fullPageText)) !== null) {
      const eventName = m[0];
      const locationName = m[1];
      if (!foundOnPage.has(eventName.toLowerCase())) {
        foundOnPage.add(eventName.toLowerCase());
        entities.push({
          text: eventName,
          type: "event",
          name: eventName,
          locationName: locationName,
          index: m.index,
          length: eventName.length
        });
      }
    }
  });

  return entities;
}

function handleLocationClick(locationName, element, entityType = "location", eventLocationName = null) {
  document.querySelectorAll(".location-badge").forEach(el => el.classList.remove("active"));
  element.classList.add("active");

  const idx = state.allLocations.findIndex(loc => loc.element === element);
  if (idx !== -1) { state.currentLocationIndex = idx; updateTimeline(); }

  if (!state.autoMap || !state.map) return;

  if (state.activeMapMarker) { state.map.removeLayer(state.activeMapMarker); state.activeMapMarker = null; }
  state.regionPolygons.forEach(p => p.setStyle({ fillOpacity: 0, opacity: 0, weight: 2 }));

  let coords = null;
  let displayName = locationName;

  if (entityType === "event" && eventLocationName) {
    coords = eventLocations[eventLocationName] || getContextualCoords(eventLocationName);
  } else {
    coords = getContextualCoords(locationName);
  }

  const entry = geoDatabase[locationName];

  if (entry && entry.type === "region" && entry.coords && Array.isArray(entry.coords[0])) {
    const poly = state.regionPolygons.find(p => p.regionName === locationName);
    if (poly) {
      poly.setStyle({ fillOpacity: 0.35, opacity: 0.9, weight: 3 });
      state.activeRegionPolygon = poly;
      state.map.fitBounds(poly.getBounds(), { padding: [30, 30] });
      poly.openPopup();
    }
  } else if (coords) {
    addToContext(locationName, coords, null); // Add to context
    state.map.setView(coords, 7);
    const markerColor = entityType === "event" ? "#ec4899" : "#ef4444";
    const marker = L.circleMarker(coords, { radius: 15, fillColor: markerColor, color: "#fff", weight: 3, fillOpacity: 0.7 })
      .addTo(state.map).bindPopup("<b>" + displayName + "</b>").openPopup();
    state.activeMapMarker = marker;
  }
}

async function renderAllPages() {
  const container = document.getElementById("pdf-container");
  container.innerHTML = "";
  state.allLocations = [];
  state.recentContext = []; // Reset context
  state.markerCluster.clearLayers();
  state.allMarkers = [];

  showLoading("Rendering pages...");

  for (let pageNum = 1; pageNum <= state.pdfDoc.numPages; pageNum++) {
    updateLoading("Rendering page " + pageNum + "/" + state.pdfDoc.numPages);

    try {
      const page = await state.pdfDoc.getPage(pageNum);
      const scale = 1.5;
      const viewport = page.getViewport({ scale });

      const pageWrapper = document.createElement("div");
      pageWrapper.className = "pdf-page-wrapper";
      pageWrapper.dataset.page = pageNum;

      const pageNumber = document.createElement("div");
      pageNumber.className = "page-number";
      pageNumber.textContent = "Page " + pageNum;
      pageWrapper.appendChild(pageNumber);

      const canvasContainer = document.createElement("div");
      canvasContainer.style.cssText = "position:relative;width:100%;";

      const canvas = document.createElement("canvas");
      const ctx = canvas.getContext("2d");
      canvas.width = viewport.width;
      canvas.height = viewport.height;
      canvas.className = "pdf-canvas";

      await page.render({ canvasContext: ctx, viewport }).promise;
      canvasContainer.appendChild(canvas);

      const textOverlay = document.createElement("div");
      textOverlay.className = "text-overlay";
      textOverlay.dataset.viewportWidth = viewport.width;
      textOverlay.dataset.viewportHeight = viewport.height;

      const textContent = await page.getTextContent();

      let fullPageText = "";
      const textItems = [];
      textContent.items.forEach(item => {
        const rawText = (item.str || "");
        if (!rawText.trim()) return;

        const startIndex = fullPageText.length;
        fullPageText += rawText;

        const rawTransform = item.transform || [];
        const transform = pdfjsLib.Util.transform(viewport.transform, rawTransform);
        const fontHeight = Math.hypot(transform[1] || 0, transform[3] || 0);
        const textWidthPx = (item.width || 0) * viewport.scale;
        const leftBase = transform[4] || 0;
        const topBase = (transform[5] || 0) - fontHeight;

        textItems.push({
          text: rawText,
          startIndex,
          endIndex: startIndex + rawText.length,
          leftBase, topBase, fontHeight, textWidthPx
        });
      });

      const pageEntities = extractEntitiesForPage(fullPageText);

      pageEntities.forEach(entity => {
        const entityStart = entity.index;
        const entityEnd = entity.index + entity.length;

        for (const item of textItems) {
          if (entityStart >= item.startIndex && entityStart < item.endIndex) {
            const localStart = entityStart - item.startIndex;
            const localLength = Math.min(entity.length, item.text.length - localStart);

            if (localLength <= 0) continue;

            const startFraction = localStart / (item.text.length || 1);
            const widthFraction = localLength / (item.text.length || 1);

            const highlightWidthBase = item.textWidthPx * widthFraction;
            const leftOffsetBase = item.leftBase + item.textWidthPx * startFraction;
            const highlightHeightBase = item.fontHeight || 14;

            const highlight = document.createElement("div");
            highlight.className = "location-badge";

            if (entity.type === "region") highlight.classList.add("region-badge");
            else if (entity.type === "event") highlight.classList.add("event-badge");

            highlight.dataset.location = entity.name;
            highlight.dataset.entityType = entity.type;
            if (entity.locationName) highlight.dataset.eventLocation = entity.locationName;
            highlight.dataset.left = leftOffsetBase;
            highlight.dataset.top = item.topBase;
            highlight.dataset.width = highlightWidthBase;
            highlight.dataset.height = highlightHeightBase;
            highlight.title = entity.name;

            highlight.onclick = () => handleLocationClick(entity.name, highlight, entity.type, entity.locationName);
            textOverlay.appendChild(highlight);

            state.allLocations.push({ name: entity.name, element: highlight, page: pageNum, type: entity.type, locationName: entity.locationName });

            let coords = entity.type === "event" && entity.locationName ? 
              (eventLocations[entity.locationName] || getContextualCoords(entity.locationName)) : getContextualCoords(entity.name);

            if (coords) {
              addToContext(entity.name, coords, pageNum);
              try {
                const marker = L.marker(coords).bindPopup("<b>" + entity.name + "</b><br>Page " + pageNum);
                state.allMarkers.push(marker);
                state.markerCluster.addLayer(marker);
              } catch (e) {}
            }

            break;
          }
        }
      });

      canvasContainer.appendChild(textOverlay);
      pageWrapper.appendChild(canvasContainer);
      container.appendChild(pageWrapper);
    } catch (e) {
      console.error("Error rendering page", pageNum, e);
    }
  }

  hideLoading();
  updateTimeline();
  rescaleOverlays();
  saveReadingPosition();
}

function rescaleOverlays() {
  document.querySelectorAll(".pdf-page-wrapper").forEach(wrapper => {
    const canvas = wrapper.querySelector("canvas");
    const overlay = wrapper.querySelector(".text-overlay");
    if (!canvas || !overlay) return;

    const vw = Number(overlay.dataset.viewportWidth) || 1;
    const vh = Number(overlay.dataset.viewportHeight) || 1;
    const scale = canvas.clientWidth / vw;

    overlay.style.width = canvas.clientWidth + "px";
    overlay.style.height = (vh * scale) + "px";
    if (canvas.parentElement) canvas.parentElement.style.height = (vh * scale) + "px";

    overlay.querySelectorAll(".location-badge").forEach(badge => {
      badge.style.left = (Number(badge.dataset.left) || 0) * scale + "px";
      badge.style.top = (Number(badge.dataset.top) || 0) * scale + "px";
      badge.style.width = (Number(badge.dataset.width) || 0) * scale + "px";
      badge.style.height = (Number(badge.dataset.height) || 0) * scale + "px";
    });
  });
}

function updateTimeline() {
  const total = state.allLocations.length;
  document.getElementById("marker-counter").textContent = (total === 0 ? 0 : state.currentLocationIndex + 1) + "/" + total;
  const progress = total > 1 ? (state.currentLocationIndex / (total - 1)) * 100 : 0;
  document.getElementById("timeline-progress").style.width = progress + "%";
}

function navigateToLocation(index) {
  if (index < 0 || index >= state.allLocations.length) return;
  state.currentLocationIndex = index;
  const loc = state.allLocations[index];
  loc.element.scrollIntoView({ behavior: "smooth", block: "center" });
  handleLocationClick(loc.name, loc.element, loc.type, loc.locationName);
}

function drawJourneyPath() {
  if (state.journeyLine) state.map.removeLayer(state.journeyLine);
  const coords = state.allLocations.map(loc => {
    if (loc.type === "event" && loc.locationName) return eventLocations[loc.locationName] || getContextualCoords(loc.locationName);
    return getContextualCoords(loc.name);
  }).filter(c => c !== null);
  if (coords.length < 2) return;
  state.journeyLine = L.polyline(coords, { color: "#ef4444", weight: 3, opacity: 0.7, dashArray: "10, 10", className: "leaflet-journey-path" }).addTo(state.map);
  state.map.fitBounds(state.journeyLine.getBounds(), { padding: [50, 50] });
}

async function playJourney() {
  if (state.journeyPlaying) { state.journeyPlaying = false; document.querySelector("#play-journey i").setAttribute("data-feather", "play"); feather.replace(); return; }
  state.journeyPlaying = true;
  document.querySelector("#play-journey i").setAttribute("data-feather", "pause");
  feather.replace();
  drawJourneyPath();
  for (let i = 0; i < state.allLocations.length && state.journeyPlaying; i++) {
    navigateToLocation(i);
    await new Promise(r => setTimeout(r, 2000));
  }
  state.journeyPlaying = false;
  document.querySelector("#play-journey i").setAttribute("data-feather", "play");
  feather.replace();
}

function performSearch(query) {
  if (!query.trim()) { clearSearchHighlights(); return; }
  clearSearchHighlights();
  state.searchResults = [];
  state.searchIndex = 0;
  const regex = new RegExp(query.replace(/[.*+?^${}()|[\]\\]/g, "\\$&"), "gi");
  document.querySelectorAll(".location-badge").forEach(badge => {
    if (regex.test(badge.dataset.location)) { badge.classList.add("search-highlight"); state.searchResults.push(badge); }
  });
  document.getElementById("search-count").textContent = state.searchResults.length > 0 ? "1/" + state.searchResults.length : "0 found";
  if (state.searchResults.length > 0) state.searchResults[0].scrollIntoView({ behavior: "smooth", block: "center" });
}

function navigateSearch(dir) {
  if (state.searchResults.length === 0) return;
  state.searchIndex = (state.searchIndex + dir + state.searchResults.length) % state.searchResults.length;
  state.searchResults[state.searchIndex].scrollIntoView({ behavior: "smooth", block: "center" });
  document.getElementById("search-count").textContent = (state.searchIndex + 1) + "/" + state.searchResults.length;
}

function clearSearchHighlights() {
  document.querySelectorAll(".search-highlight").forEach(el => el.classList.remove("search-highlight"));
  state.searchResults = [];
  document.getElementById("search-count").textContent = "";
}

async function performOCR(imageFile) {
  showLoading("Initializing OCR...");
  try {
    const result = await Tesseract.recognize(imageFile, "eng", { logger: m => { if (m.status === "recognizing text") updateLoading("OCR: " + Math.round(m.progress * 100) + "%"); } });
    hideLoading();
    generatePDFFromText(result.data.text, "OCR Result");
  } catch (error) { hideLoading(); alert("OCR Error: " + error.message); }
}

function generatePDFFromText(text, title = "Document") {
  if (!window.jspdf) { alert("jsPDF not loaded"); return; }
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF();
  const lines = doc.splitTextToSize(text, 170);
  let y = 20;
  doc.setFontSize(16);
  doc.text(title, 20, y);
  y += 15;
  doc.setFontSize(11);
  lines.forEach(line => { if (y > 280) { doc.addPage(); y = 20; } doc.text(line, 20, y); y += 6; });
  loadPDF(doc.output("blob"));
}

function exportGeoJSON() {
  const features = state.allLocations.map(loc => {
    let coords = loc.type === "event" && loc.locationName ? (eventLocations[loc.locationName] || getContextualCoords(loc.locationName)) : getContextualCoords(loc.name);
    if (!coords) return null;
    return { type: "Feature", properties: { name: loc.name, page: loc.page, type: loc.type }, geometry: { type: "Point", coordinates: [coords[1], coords[0]] } };
  }).filter(f => f !== null);
  downloadFile(JSON.stringify({ type: "FeatureCollection", features }, null, 2), "annotations.geojson", "application/json");
}

function exportKML() {
  let kml = '<?xml version="1.0" encoding="UTF-8"?>\n<kml xmlns="http://www.opengis.net/kml/2.2">\n<Document><name>ScrollThroughTime</name>';
  state.allLocations.forEach(loc => {
    let coords = loc.type === "event" && loc.locationName ? (eventLocations[loc.locationName] || getContextualCoords(loc.locationName)) : getContextualCoords(loc.name);
    if (coords) kml += "<Placemark><name>" + loc.name + "</name><Point><coordinates>" + coords[1] + "," + coords[0] + ",0</coordinates></Point></Placemark>";
  });
  kml += "</Document></kml>";
  downloadFile(kml, "annotations.kml", "application/vnd.google-earth.kml+xml");
}

function exportCSV() {
  let csv = "Name,Type,Page,Latitude,Longitude\n";
  state.allLocations.forEach(loc => {
    let coords = loc.type === "event" && loc.locationName ? (eventLocations[loc.locationName] || getContextualCoords(loc.locationName)) : getContextualCoords(loc.name);
    coords = coords || ["", ""];
    csv += '"' + loc.name + '","' + loc.type + '",' + loc.page + ',' + coords[0] + ',' + coords[1] + '\n';
  });
  downloadFile(csv, "annotations.csv", "text/csv");
}

function downloadFile(content, filename, type) {
  const blob = new Blob([content], { type });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(blob);
  a.download = filename;
  a.click();
}

async function loadPDF(fileOrBlob) {
  try {
    showLoading("Loading PDF...");
    const arrayBuffer = await fileOrBlob.arrayBuffer();
    state.pdfDoc = await pdfjsLib.getDocument({ data: new Uint8Array(arrayBuffer) }).promise;
    document.getElementById("pdf-placeholder").classList.add("hidden");
    document.getElementById("pdf-container").classList.remove("hidden");
    await renderAllPages();
    restoreReadingPosition();
    localforage.setItem("cachedDocument", arrayBuffer);
  } catch (error) { hideLoading(); alert("Error loading PDF: " + error.message); }
}

  doc.text("The Siege of Sevastopol lasted almost a year.", 20, 45);
  doc.text("Russia faced the Ottoman Empire, Britain, and France.", 20, 55);
  doc.text("The Treaty of Paris ended the conflict.", 20, 65);
  doc.text("Bessarabia and Moldavia changed hands near the Danube.", 20, 75);
  loadPDF(doc.output("blob"));
}

function saveReadingPosition() { const viewer = document.getElementById("pdf-viewer"); localforage.setItem("readingPosition", { scroll: viewer.scrollTop, index: state.currentLocationIndex, ts: Date.now() }); }
async function restoreReadingPosition() { const data = await localforage.getItem("readingPosition"); if (data && Date.now() - data.ts < 86400000) { document.getElementById("pdf-viewer").scrollTop = data.scroll; if (data.index < state.allLocations.length) { state.currentLocationIndex = data.index; updateTimeline(); } } }
async function loadCachedDocument() { const cached = await localforage.getItem("cachedDocument"); if (cached) { loadPDF(new Blob([cached], { type: "application/pdf" })); return true; } return false; }

function showLoading(text) { document.getElementById("loadingText").textContent = text; document.getElementById("loadingOverlay").classList.add("show"); }
function updateLoading(text) { document.getElementById("loadingText").textContent = text; }
function hideLoading() { document.getElementById("loadingOverlay").classList.remove("show"); }

function updateReadingProgress() { const viewer = document.getElementById("pdf-viewer"); const percent = (viewer.scrollTop / (viewer.scrollHeight - viewer.clientHeight || 1)) * 100; document.getElementById("readingProgress").style.width = Math.min(percent, 100) + "%"; saveReadingPosition(); }

function toggleDarkMode() { state.darkMode = !state.darkMode; document.documentElement.classList.toggle("dark", state.darkMode); localforage.setItem("darkMode", state.darkMode); document.querySelector("#dark-mode-toggle i").setAttribute("data-feather", state.darkMode ? "sun" : "moon"); feather.replace(); }

function initResizer() {
  const handle = document.getElementById("resizeHandle"), pdfViewer = document.getElementById("pdf-viewer"), mapContainer = document.getElementById("map-container");
  let startY, startX, startH, startW;
  function start(e) { state.isResizing = true; const touch = e.type === "touchstart"; startY = touch ? e.touches[0].clientY : e.clientY; startX = touch ? e.touches[0].clientX : e.clientX; startH = pdfViewer.offsetHeight; startW = pdfViewer.offsetWidth; document.addEventListener("mousemove", resize); document.addEventListener("touchmove", resize); document.addEventListener("mouseup", stop); document.addEventListener("touchend", stop); e.preventDefault(); }
  function resize(e) { if (!state.isResizing) return; const touch = e.type === "touchmove"; if (window.innerWidth <= 768) { const y = touch ? e.touches[0].clientY : e.clientY; const h = Math.max(window.innerHeight * 0.2, Math.min(window.innerHeight * 0.8, startH + y - startY)); pdfViewer.style.height = h + "px"; mapContainer.style.height = (window.innerHeight - h - 12) + "px"; } else { const x = touch ? e.touches[0].clientX : e.clientX; const w = Math.max(window.innerWidth * 0.2, Math.min(window.innerWidth * 0.8, startW + x - startX)); pdfViewer.style.width = w + "px"; mapContainer.style.width = (window.innerWidth - w - 10) + "px"; } if (state.map) state.map.invalidateSize(); rescaleOverlays(); }
  function stop() { state.isResizing = false; document.removeEventListener("mousemove", resize); document.removeEventListener("touchmove", resize); document.removeEventListener("mouseup", stop); document.removeEventListener("touchend", stop); }
  handle.addEventListener("mousedown", start); handle.addEventListener("touchstart", start, { passive: false });
}

function initGestures() { const viewer = document.getElementById("pdf-viewer"); const hammer = new Hammer(viewer); hammer.get("swipe").set({ direction: Hammer.DIRECTION_HORIZONTAL }); hammer.on("swipeleft", () => { if (state.currentLocationIndex < state.allLocations.length - 1) navigateToLocation(state.currentLocationIndex + 1); }); hammer.on("swiperight", () => { if (state.currentLocationIndex > 0) navigateToLocation(state.currentLocationIndex - 1); }); }

window.addEventListener("beforeinstallprompt", e => { e.preventDefault(); state.deferredInstallPrompt = e; document.getElementById("installBanner").classList.add("show"); });
document.getElementById("installBtn")?.addEventListener("click", async () => { if (state.deferredInstallPrompt) { state.deferredInstallPrompt.prompt(); state.deferredInstallPrompt = null; document.getElementById("installBanner").classList.remove("show"); }});
document.getElementById("dismissInstall")?.addEventListener("click", () => document.getElementById("installBanner").classList.remove("show"));

document.getElementById("upload-btn").addEventListener("click", () => document.getElementById("pdf-input").click());
document.getElementById("pdf-input").addEventListener("change", e => { const file = e.target.files?.[0]; if (file) { file.type.startsWith("image/") ? performOCR(file) : loadPDF(file); } });
document.getElementById("ocr-btn").addEventListener("click", () => document.getElementById("ocr-input").click());
document.getElementById("ocr-input").addEventListener("change", e => { if (e.target.files?.[0]) performOCR(e.target.files[0]); });
document.getElementById("generate-test-pdf").addEventListener("click", generateTestPDF);
document.getElementById("auto-map-toggle").addEventListener("click", e => { state.autoMap = !state.autoMap; e.target.textContent = "Auto " + (state.autoMap ? "ON" : "OFF"); e.target.classList.toggle("bg-teal-500", state.autoMap); e.target.classList.toggle("bg-gray-400", !state.autoMap); });
document.getElementById("dark-mode-toggle").addEventListener("click", toggleDarkMode);
document.getElementById("map-style").addEventListener("change", e => changeMapStyle(e.target.value));
document.getElementById("prev-marker").addEventListener("click", () => navigateToLocation(state.currentLocationIndex - 1));
document.getElementById("next-marker").addEventListener("click", () => navigateToLocation(state.currentLocationIndex + 1));
document.getElementById("play-journey").addEventListener("click", playJourney);
document.getElementById("timeline-bar").addEventListener("click", e => { if (!state.allLocations.length) return; const rect = e.currentTarget.getBoundingClientRect(); const idx = Math.floor((e.clientX - rect.left) / rect.width * state.allLocations.length); navigateToLocation(Math.min(idx, state.allLocations.length - 1)); });
document.getElementById("pdf-viewer").addEventListener("scroll", updateReadingProgress);
window.addEventListener("resize", rescaleOverlays);

document.getElementById("search-btn").addEventListener("click", () => performSearch(document.getElementById("search-input").value));
document.getElementById("search-input").addEventListener("keypress", e => { if (e.key === "Enter") performSearch(e.target.value); });
document.getElementById("search-prev").addEventListener("click", () => navigateSearch(-1));
document.getElementById("search-next").addEventListener("click", () => navigateSearch(1));

document.getElementById("export-btn").addEventListener("click", () => document.getElementById("exportModal").classList.add("show"));
document.getElementById("close-export-modal").addEventListener("click", () => document.getElementById("exportModal").classList.remove("show"));
document.getElementById("export-geojson").addEventListener("click", () => { exportGeoJSON(); document.getElementById("exportModal").classList.remove("show"); });
document.getElementById("export-kml").addEventListener("click", () => { exportKML(); document.getElementById("exportModal").classList.remove("show"); });
document.getElementById("export-csv").addEventListener("click", () => { exportCSV(); document.getElementById("exportModal").classList.remove("show"); });

async function init() { initMap(); initResizer(); initGestures(); feather.replace(); const dm = await localforage.getItem("darkMode"); if (dm) { state.darkMode = true; document.documentElement.classList.add("dark"); } await loadCachedDocument(); }
init();
</script>
</body>
</html>
